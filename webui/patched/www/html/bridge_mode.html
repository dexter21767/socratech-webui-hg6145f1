<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/bridge_mode.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("internet");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="bridge_mode_prompt"></font></p>
		</div>
        <br/>
		<form id="firewall_form" method="post">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name"><font i18n="lan_binding_title"></font></div>
					<div class="main_item_content">
						<input type="checkbox" id="LAN4_enable" name="LAN4_enable" value="1"/>&nbsp;&nbsp;LAN4
					</div>
				</div>
				<div class="main_button">	
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="inet_apply" class="input_button" i18n="inet_apply" i18n-set="value" onclick="save_apply()"/>&nbsp; &nbsp;
						<input type="button" id="inet_cancel" class="input_button" i18n="inet_cancel" i18n-set="value" onclick="window.location.reload()"/>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
