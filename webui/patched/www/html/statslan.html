<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language ="javascript "type ="text/javascript">
        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
		document.write('<script  src="../js/statslan.js?'+new Date().getTime()+'"><'+'/'+'script>');
	</script>
	<script language='javascript'>
		$(document).ready(function(){
			//优化滚动条，无需改动
			//customScrollBar("html");
		});
	</script>
</head>
<body class='main_config_body'>
	<form>
	    <label><b>在本页面上，您可以查询用户侧以太网接口信息</b></label>
		<br><br> 
		<label><b>动态IP地址分配信息</b></label>
		<table width="100%" cellspacing="0" cellpadding="3px" border="1px">
            <tbody>
				<tr>
					<th width="10%">IP地址</th>
					<th width="10%">MAC地址</th>
					<th width="8%">设备类型</th>
					<th width="8%">主机名</th>
					<th width="8%">别名</th>
					<th width="8%">端口号</th>
					<th width="10%">剩余租约周期</th>
					<th width="10%">品牌名</th>
					<th width="10%">操作系统</th>
					<th width="10%">接收包数</th>
					<th width="10%">发送包数</th>
					<th width="8%">状态</th>
				</tr>
	        </tbody>
	        <tbody id='lan_host'>
	        </tbody>
        </table>
		<br><br>
		<label><b>以太网接口状态信息</b></label>
		<table width="100%" cellspacing="0" cellpadding="3px" border="1px">
            <tbody>
            	<tr>
					<th rowspan="2" width="10%">端口号</th>
					<th colspan="3" width="30%">状态</th>
					<th colspan="2" width="30%">接收</th>
					<th colspan="2" width="30%">发送</th>
				</tr>
				<tr align="center">
					<th width="10%">模式</th>
					<th width="10%">速率</th>
					<th width="10%">连接</th>
					<th width="15%">字节数</th>
					<th width="15%">帧数</th>
					<th width="15%">字节数</th>	
					<th width="15%">帧数</th>
				</tr>
	        </tbody>
	        <tbody id="port_info">
	        </tbody>
        </table>
        <br><br>
    </form>
		
</body>
</html>
