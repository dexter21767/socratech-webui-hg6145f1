<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/jquery.formFill.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/logSettings_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("log");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="syslog_prompt">syslog_prompt</font></p>
		</div>
		<form id="log_settings_form" novalidate="novalidate" method="post">
			<div class="main_item" id="log_enable_div">
				<div class="main_item_name"><font i18n="log_enalbe">log_enalbe</font></div>
				<div class="main_item_content">
					<div class="switch_content switch_content_on" id="LogEnable_checkbox">
						<input type="hidden"  id="LogEnable_checkbox_value" name="data.enable">
					</div>
				</div>
			</div>
			<div class="main_item" id="log_level_div">
				<div class="main_item_name"><font i18n="log_level">log_level</font></div>
				<div class="main_item_content">
					<select name="data.loglevel" id="LevelLog_select">
						<option value="0">Emergency</option>
						<option value="1">Alert</option>
						<option value="2">Critical</option>
						<option value="3">Error</option>
						<option value="4">Warning</option>
						<option value="5">Notice</option>
						<option value="6">Informational</option>
						<option value="7">Debugging</option>
					</select>
				</div>
			</div>
			
			<div class="main_item">
				<div class="main_item_name"><font i18n="show_level">show_level</font></div>
				<div class="main_item_content">
					<select name="data.logviewlevel" id="LevelDisplay_select">
						<option value="0" class="trad">Emergency</option>
						<option value="1" class="trad">Alert</option>
						<option value="2" class="trad">Critical</option>
						<option value="3" class="trad">Error</option>
						<option value="4" class="trad">Warning</option>
						<option value="5" class="trad">Notice</option>
						<option value="6" class="trad">Informational</option>
						<option value="7" class="trad">Debugging</option>
					</select>
				</div>
			</div>
			<div class="main_save">
				<input type="button" onclick="saveApply()" id="apply" i18n="log_apply" i18n-set="value" class="input_button">
			</div>
			<textarea id="logtable" rows="15" cols="93" readonly="readonly"></textarea>
			<div class="main_save">
				<input type="button" onclick="clearLog()" id="clear" i18n="clear_log" i18n-set="value" class="input_button">
				&nbsp;
				<input type="button" onclick="downloadLog()" id="download" i18n="download_log" i18n-set="value" class="input_button">
				&nbsp;
				<input type="button" onclick="refreshLog()" id="refresh" i18n="refresh_log" i18n-set="value" class="input_button">
			</div>
		</form>
		
	</body>
</html>
