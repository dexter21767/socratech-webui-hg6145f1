<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/tr69.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title">ITMS服务器</p>
			<p class="main_header_hint">在本页面，您可以修改ITMS相关配置。</p>
		</div>
		<form id="tr69_form">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name">启用周期上报</div>
					<div class="main_item_content">
						<input type="checkbox" id="Tr69Inform_checkbox" name="Tr69Inform_checkbox"/>&nbsp;
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">通知间隔时间</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="Informinter_text" name="Informinter_text"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">ITMS认证地址</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="Acsurl_text" name="Acsurl_text"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">ITMS认证用户名</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="AcsUserName_text" name="AcsUserName_text"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">ITMS认证密码</div>
					<div class="main_item_content">
						<input type="password" class="input_text" autocomplete="off" id="AcsPassWord_password" name="AcsPassWord_password"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">反向认证用户名</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="ConnReqName_text" name="ConnReqName_text"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">反向认证密码</div>
					<div class="main_item_content">
						<input type="password" class="input_text" autocomplete="off" id="ConnReqPassWord_password" name="ConnReqPassWord_password"/>
					</div>
				</div>
				<div id="Middleware_div" style="display:none">
				<div class="main_item" >
					<div class="main_item_name">中间件状态</div>
					<div class="main_item_content">
						<select id="Middleware_select">
							<option value="1">不启用中间件</option>
							<option value="0">启用中间件(含TR069)</option>
							<option value="2">启用中间件(不含TR069)</option>
						</select>
					</div>
				</div>
				<div class="main_item middleware_item">
					<div class="main_item_name">中间件服务器地址</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="MldAddr_text" name="MldAddr_text"/>
					</div>
				</div>
				<div class="main_item middleware_item">
					<div class="main_item_name">中间件服务器端口</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="MldPort_text" name="MldPort_text"/>
					</div>
				</div>
				</div>
			<div class="main_save">
				<input type="button" id="save_apply" class="input_button" value="保存" onclick="saveApply()"/>
			</div>
		</form>
	</body>
</html>
