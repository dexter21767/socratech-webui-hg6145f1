<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/media_sharing_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("media_sharing");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="media_sharing_prompt">media_sharing_prompt</font></p>
		</div>
		<form id="media_sharing_form" method="post">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name"><font i18n="enable_media_sharing">enable_media_sharing</font></div>
					<div class="main_item_content">
						<input type="checkbox" id="EnableMediaSharing"/>&nbsp;
					</div>
				</div>
			</div>
			<div class="main_item">
				<div class="main_submit" style="width: 25%;"></div>				
				<div class="main_submit" style="width: 75%;">
					<input type="button" id="alg_apply" class="input_button" i18n="alg_apply" i18n-set="value" onclick="saveApply()"/>
					<input type="button" id="alg_cancel" class="input_button" i18n="alg_cancel" i18n-set="value" onclick="window.location.reload()"/>
				</div>
			</div>
		</form>
	</body>
</html>
