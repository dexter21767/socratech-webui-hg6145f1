<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/HTTPS_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("firewall");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint" id="https_prompt_inter"><font i18n="https_prompt">https_prompt</font></p>
			<p class="main_header_hint" id="https_prompt_ROM_RCSRDS" style="display:none"><font i18n="https_prompt_ROM_RCSRDS">https_prompt</font></p>
		</div>
		<br/>
		<form id="firewall_form">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name">HTTPS</div>
					<div class="main_item_content">
						<input type="radio" name="https_enable" value="1" id="https_enable"/><font i18n="rc_enable">rc_enable</font>&nbsp;&nbsp;&nbsp;
						<input type="radio" name="https_enable" value="0" id="https_disable"/><font i18n="rc_disable" id="rc_disable">rc_disable</font>
					</div>
				</div>
				<div class="main_item" id="https_button_div">
					<div class="main_submit" style="width: 25%;"></div>	
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="submit_btn" class="input_button" i18n="recontrolApply" i18n-set="value" onclick="SaveApply()"/>&nbsp;&nbsp;
						<input type="button" id="cancel_btn" class="input_button" i18n="recontrolCancel" i18n-set="value" onclick="Cancel()"/>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
