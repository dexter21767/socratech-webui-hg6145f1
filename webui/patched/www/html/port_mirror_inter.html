<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/port_mirror_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script> 
	</head>
	<script type="text/javascript">
		setDomain("internet");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint" i18n="cpu_port_mirror_prompt"></p>
		</div>
		<br>
		<form>
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name"><font i18n="mirror_enable">mirror_enable</font></div>
					<div class="main_item_content">
						<input type="radio" id="mirror_enable" name="mirror_enable" value="1"/><font i18n="mirror_enable">mirror_enable</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
						<input type="radio" id="mirror_disable" name="mirror_enable" value="0" checked /><font i18n="mirror_disable">mirror_disable</font>
						&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="mirror_title"></div>
					<div class="main_item_content" id="mirror">
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="mirror_d_title"></div>
					<div class="main_item_content">
						<select id="catch" class="main_select">
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name" i18n="direction_title"></div>
					<div class="main_item_content">
						<select id="direction" class="main_select">
							<option value="1">InDirection</option>
							<option value="2">OutDirection</option>
							<option value="3">BothDirection</option>
						</select>
					</div>
				</div>
				<div class="main_button">
					<div class="main_submit" style="width: 25%;"></div>
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="save_apply" class="input_button" onclick="saveApply()" i18n="inet_apply" i18n-set="value">&nbsp; &nbsp;
						<input type="button" id="cancel_btn" class="input_button" onclick="window.location.reload()" i18n="inet_cancel" i18n-set="value">
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
