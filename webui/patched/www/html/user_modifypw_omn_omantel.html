<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
                document.write('<script  src="../js/aes.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/user_modifypw_omn_omantel.js?'+new Date().getTime()+'"><'+'/'+'script>');
			
		</script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="user_account_prompt">user_account_prompt</font></p>
		</div>
		<br>
		<form id="userManagementForm_lan" method="post" >
            <div class="table_bg" border="0" cellpadding="0" cellspacing="1" width="100%">
                <div class="table_title">
                    <div colspan="2"><font i18n="account_management">account_management</font></div>
                </div>
                <div class="main_item">
                    <div class="main_item_name"><font i18n="account_user">account_user</font></div>
                    <div class="main_item_content">
                        <input type="text" autocomplete="off"  name="username" id="username" value="" disabled="disabled" style="width: 170px"/> <span class="redcolorfont">*</span>
                    </div>
                    <div id="main_item-error" class="main_item_error_hint_extra"></div>
                </div>
                <div class="main_item" id="old_Lan_Pwd" style="display:none">
                    <div class="main_item_name"><font i18n="old_lan_password">Old LAN password</font></div>
                    <div class="main_item_content"><input class="fh-text-security" type="text"  autocomplete="off" readonly onfocus="removeAttribute('readonly')" name="lan_old_password" id="lan_old_password" style="width: 170px;cursor:text;"/><span class="redcolorfont">*</span><span style="color:grey"></span>
                    </div>
                    <div id="main_item-error" class="main_item_error_hint_extra"></div>
                </div>				
                <div class="main_item">
                    <div class="main_item_name"><font i18n="new_lan_password">New LAN password</font></div>
                    <div class="main_item_content"><input class="fh-text-security" type="text" autocomplete="off" readonly onfocus="removeAttribute('readonly')" name="lan_new_password" id="lan_new_password" style="width: 170px;cursor:text;"/><span class="redcolorfont">*</span><span style="color:grey"></span>
                    </div>
                    <div id="main_item-error" class="main_item_error_hint_extra"></div>
                </div>
                <div class="main_item">
                    <div class="main_item_name"><font i18n="lan_password_confirm">LAN Password Confirm</font></div>
                    <div class="main_item_content"><input class="fh-text-security" type="text"  autocomplete="off" readonly onfocus="removeAttribute('readonly')" name="lan_confirm_password" id="lan_confirm_password" style="width: 170px;cursor:text;"/><span class="redcolorfont">*</span>
                    </div>
                    <div id="main_item-error" class="main_item_error_hint_extra"></div>
                </div>
                <div class="main_item" style="height: 36px">
                    <div class="main_submit" style="width: 25%;"></div>
                    <div class="main_submit" style="width: 75%;">
                        <input type="button" class="input_button" id="lan_save_apply" name="apply" onclick="lan_saveApply()" i18n="modifyPassword" i18n-set="value" />&nbsp; &nbsp;
                        <input type="button" class="input_button" id="lan_cancel" i18n="cancel" i18n-set="value" onclick="window.location.reload()" />
                    </div>
                </div>
            </div> 
        </form>

	</body>
</html>
