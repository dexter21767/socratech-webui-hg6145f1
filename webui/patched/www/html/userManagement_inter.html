<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
				document.write('<script  src="../js/aes.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/userManagement_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
			
		</script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="userAccount_title">userAccount_title</font></p>
		</div>
		<br>
		<form id="userManagementForm">
			<div class="table_bg" border="0" cellpadding="0" cellspacing="1" width="100%">
				<div class="table_title">
					<div colspan="2"><font i18n="account_management">account_management</font></div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="account">account</font></div>
					<div class="main_item_content">
						<select id="username" >
							<option value="user" i18n="CommonUser"></option>
							<option value="admin" i18n="AdministratorUser"></option>
						</select>
					</div>
				</div>
				<div class="main_item account" style="display:none;">
					<div class="main_item_name"><font i18n="Original Password">Original Password</font></div>
					<div class="main_item_content">
						<div>
							<input class="fh-text-security" type="text"  placeholder="old password" autocomplete="off"  name="password" id="PdCfm_pd">						
						</div>&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="New Password">new password</font></div>
					<div class="main_item_content">
						<div >
							<input class="fh-text-security" type="text" maxlength="16" placeholder="new password" autocomplete="off"  name="newPassword" id="PdNew_pd">
						</div>&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="Confirm Password">confirm password</font></div>
					<div class="main_item_content">
						<div>
							<input class="fh-text-security" type="text" maxlength="16" placeholder="confirm password" autocomplete="off"  name="confirmPassword" id="confirm_pd">
						</div>&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
			</div>
			<div class="main_item" style="display:none">
				<div class="main_item_name"></div>
				<div id="password_tips">
						<span></span><span></span><span></span><span></span>
				</div>
			</div>
			<div class="main_button">	
                <div class="main_submit" style="width: 25%;"></div>				
                <div class="main_submit" style="width: 75%;">
					<input type="button" class="input_button" id="apply_button" name="apply" onclick="saveApply()" i18n="modifyPassword" i18n-set="value">&nbsp; &nbsp;
					<input type="button" class="input_button" id="cancel_button" i18n="cancel" i18n-set="value" onclick="CancelBtn()"/>
				</div>
			</div>
		</form>
	</body>
</html>
