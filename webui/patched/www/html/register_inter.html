<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
	<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript" type="text/javascript">
		document.write('<link rel="stylesheet" type="text/css" href="../css/main_style.css?' + new Date().getTime() + '"><' + '/' + 'link>');
		document.write('<script  src="../js/jquery.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/xhr.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/util_global_vars.js?'+new Date().getTime()+'"><'+'/'+'script>');
		document.write('<script  src="../js/util_functions.js?'+new Date().getTime()+'"><'+'/'+'script>');
		document.write('<script  src="../js/validate.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/i18n.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/aes.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/access_no_menu.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/register_inter.js?' + new Date().getTime() + '"><' + '/' + 'script>');
	</script>
</head>
<script type="text/javascript">
	setDomain("sncfg");
</script>
<style type="text/css">
	.go_back_page {
		float: right;
		margin-top: 20px;
	}
	.go_back_page:hover {
		cursor: pointer;
  		color: rgb(153, 0, 0);
	}
</style>

<body class='main_config_body'>
	<div class="main_header">
		<p class="main_header_hint">
			<font i18n="registerPrompt">registerPrompt</font>
		</p>
	</div>
	<div class="go_back_page" onclick="gotoLoginPage()">back to login page</div>
	<form id="loid_form" method="post" style="margin-top: 50px;">
		<div class="main_content">
			<div class="table_bg">
				<div class="main_item">
					<div class="main_item_name" style="width: 20%;">LOID</div>
					<div class="main_item_content" style="width: calc(80% - 3px);">
						<input type="text" class="input_text" style="width: 130px;" autocomplete="off" maxlength="24"
							name="LoidId_text" id="LoidId_text" />
						<span class="redcolorfont">*</span>
						<font i18n="sncfg_loidTips"> sncfg_loidTips</font>
					</div>
					<div id="LOID_error" class="main_item_error_hint_extra"></div>
				</div>

				<div class="main_item">
					<div class="main_item_name" style="width: 20%;">
						<font i18n="sncfg_lopwd">sncfg_lopwd</font>
					</div>
					<div class="main_item_content" style="width: calc(80% - 3px);">
						<input type="text" class="input_text fh-text-security" style="width: 130px;" autocomplete="off"
							maxlength="12" name="Loidpwd_text" id="Loidpwd_text" oncopy="return false"
							oncut="return false" />
						<input type="button" class="input_button" i18n="change_eye" i18n-set="value"
							onclick="change_eye()" />&nbsp; &nbsp;
						<font i18n="sncfg_lopwdTips">sncfg_lopwdTips</font>
					</div>
					<div id="sncfg_lopwd_error" class="main_item_error_hint_extra"></div>
				</div>
			</div>
			<div class="main_item">
				<div class="main_submit" style="width: 20%;"></div>
				<div class="main_submit" style="width: 80%;">
					<input type="button" id="loid_save" class="input_button" i18n="sncfg_apply" i18n-set="value"
						onclick="LOIDsaveApply()" />
					<input type="button" id="loid_cancle" class="input_button" i18n="sncfg_cancel" i18n-set="value"
						onclick="LOIDCancel()" />
				</div>
			</div>
		</div>
	</form>
</body>

</html>
