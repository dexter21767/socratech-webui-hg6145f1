<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/qos_app.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script> 
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title">QoS业务设置</p>
			<p class="main_header_hint">在本页面，您可以修改QoS业务参数。<br/>注：最多可以配置4条QoS业务。</p>
		</div>
		<form id="qos_form">
			<br />
			<table width="60%" style="margin-left: 100px" cellspacing="0" cellpadding="3px" border="1px">
				<tr>
					<th width="35%">业务名称</th>
					<th width="35%">分类队列</th>
					<th width="30%">操作</th>
				</tr>
				<tbody id="apps">
				</tbody>
			</table>
			<br />
			
			<div id="adddiv" style="display:none">
				<div class="main_content">
					<div class="main_item">
						<div class="main_item_name">业务名称</div>
						<div class="main_item_content">
							<select id="AppName" class="main_select">
								<option value="TR069">TR069</option> 
								<option value="VOIP">VOIP</option>
								<option value="iTV">iTV</option>
								<option value="INTERNET">INTERNET</option>
							</select>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name">分类队列</div>
						<div class="main_item_content">
							<select id="ClassQueue" class="main_select">
								<!--<option value="1">Q1</option>
								<option value="2">Q2</option>
								<option value="3">Q3</option>
								<option value="4">Q4</option>
								<option value="5">Q5</option>
								<option value="6">Q6</option>
								<option value="7">Q7</option>
								<option value="8">Q8</option>-->
							</select>
						</div>
					</div>
				</div>
				<div class="main_save">
					<input type="button" id="qos_apply_btn" class="input_button" value="添加" onclick="addApp()"/>
				</div>
			</div>
		</form>
	</body>
</html>
