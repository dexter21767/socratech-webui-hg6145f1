<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript" type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/samba.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("samba");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="samba_prompt">samba_prompt</font></p>
		</div>
        <br/>
		<form id="ddos_form" method="post">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name"><font i18n="samba_enable">samba_enable</font></div>
					<div class="main_item_content">
						<input type="radio" id="samba_enable" name="samba_enable" value="1"/><font i18n="enable">enable</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
						<input type="radio" id="samba_disable" name="samba_enable" value="0" checked /><font i18n="disable">disable</font>
						&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
				<div class="main_button">	
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="samba_apply" class="input_button" i18n="btn_apply" i18n-set="value" onclick="save_apply()"/>&nbsp; &nbsp;
						<input type="button" id="samba_cancel" class="input_button" i18n="btn_cancel" i18n-set="value" onclick="cancel()"/>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
