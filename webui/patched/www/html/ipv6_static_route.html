<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/ipv6_static_route.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
		
	</head>
	<script type="text/javascript">
		setDomain("firewall");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="Ipv6StaticRoute_prompt">Ipv6StaticRoute_prompt</font></p>
		</div>
	    </br>
		<form id="ip_filter_list_form" method="post">
			<div class="main_content">		
				
					<div style="float:right">
						<input type="button" i18n="firewall_add" i18n-set="value" id="fw_add" class="input_button" onClick="addfilter()">
						<input type="button" i18n="firewall_delete" i18n-set="value" id="fw_delete" class="input_button" onClick="click_remove()">
			  			<input type="button" i18n="firewall_delete_all" i18n-set="value" id="fw_deleteAll" class="input_button" onClick="click_remove_all()">
					<br/>
				</div>
			</div>
			<br/>
			<table width="100%" class="table_bg" cellspacing="1" cellpadding="0" border="0">
				<tr class="table_title">
					<td colspan="6"><font i18n="ipv6_staticListHead">ipv6_staticListHead</font></td>
				</tr>
				<tr class="table_head_title">
					<td width="10%" align='center'><font i18n="WanName_title">wanName_title</font></td>
					<td width="30%" align='center'><font i18n="DstPrefix_title">DstPrefix_title</font></td>
					<td width="26%" align='center'><font i18n="NextHop_title">NextHop_title</font></td>
					<td width="10%" align='center'><font i18n="ipv6StaticRoute_state">ipv6StaticRoute_state</font></td>
					<td width="4%" align='center' id="fw_remove_flag_title"></td>		
				</tr>
				<tbody id='ipfilter_List' style="font-size: 12px">
				</tbody> 
			</table>
			</br>
			<div class="main_content" id = "fw_config_form" style="display:none">
				<div class="main_item">
					<div class="main_item_name"><font i18n="WanName_title">WanName_title</font></div>
					<div class="main_item_content">
						<select id="wan_name"  style="width:200px">
						</select>
					</div>
					<div id="MinSourceAddress-error" class="main_item_error_hint_extra"></div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="DstPrefix_title">DstPrefix_title</font></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off"style="width: 200px;" id="DstPrefix"  name="DstPrefix" style="width:150px"/>&nbsp;<span class="redcolorfont">*</span>
						
					</div>
					<div id="MinSourcePort-error" class="main_item_error_hint_extra"></div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="NextHop_title">NextHop_title</font></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off"style="width: 200px;" id="NextHop" name="NextHop" style="width:150px"/>
						
					</div>
					<div id="MinDestinationAddress-error" class="main_item_error_hint_extra"></div>
				</div>
				<div class="main_item">
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="firewall_apply" class="input_button" i18n="firewall_apply" i18n-set="value" onclick="doSave()"/>
						<input type="button" id="firewall_cancel" class="input_button" i18n="firewall_cancel" i18n-set="value" onclick="displayTableHtml()"/>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
