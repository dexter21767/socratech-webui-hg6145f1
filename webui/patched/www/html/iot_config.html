<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
				document.write('<script  src="../js/aes.js?' + new Date().getTime() + '"><' + '/' + 'script>');
			document.write('<script  src="../js/iot_config.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("internet");
	</script>
	<style type="text/css">
		.input_text {width: 280px}
	</style>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="IOT_prompt">IOT_prompt</font></p>
		</div>
        <br/>
		<form id="Iot_form" method="post">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name"><font i18n="IOT_Agent_Enable">IOT_Agent_Enable</font></div>
					<div class="main_item_content">
						<input type="radio" id="iot_enable" name="iot_enable" value="1"/><font i18n="iot_enable">iot_enable</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
						<input type="radio" id="iot_disable" name="iot_enable" value="0"/><font i18n="iot_disable">iot_disable</font>
						&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
			<div class="main_item" id="div_iot_button">
				<div class="main_submit" style="width: 25%;"></div>				
				<div class="main_submit" style="width: 75%;">
					<input type="button" id="iot_enable_apply" class="input_button" i18n="iot_apply" i18n-set="value" onclick="save_enable_apply()"/>&nbsp; &nbsp;
					<input type="button" id="iot_enable_cancel" class="input_button" i18n="iot_cancel" i18n-set="value" onclick="window.location.reload()"/>
				</div>
			</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="iot_url">iot_url</font></div>
					<div class="main_item_content">
						<input type="text" class="input_text" name="iot_url" id="iot_url"/>
						&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="iot_password">iot_password</font></div>
					<div class="main_item_content">
						<input type="text" class="input_text fh-text-security" name="iot_password" id="iot_password" autocomplete="off" />
						&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
				<div class="main_item" id="div_other_button">	
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="iot_apply" class="input_button" i18n="iot_apply" i18n-set="value" onclick="save_apply()"/>&nbsp; &nbsp;
						<input type="button" id="iot_cancel" class="input_button" i18n="iot_cancel" i18n-set="value" onclick="window.location.reload()"/>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
