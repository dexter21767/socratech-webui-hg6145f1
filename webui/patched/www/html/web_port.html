<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
        	document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/web_port.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("application");
	</script>
	<style type="text/css">
		.main_item_name {width: 250px;}
		.main_item_content {width: calc(100% - 253px);}
	</style>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint">
				<font i18n="web_port_prompt">web_port_prompt</font>
			</p>
		</div>
		<br>
		<form id="web_port_form">
			<div id="register_div22">
				<div class="main_content">
					<div class="main_item">
						<div class="main_item_name" ><font i18n="web_port_title1">web_port_title1</font></div>
						<div class="main_item_content">
							<input type="text" class="input_text" style="width:100px;" disabled="disabled"  id="web_port" /></span>
						</div>

					</div>
					<div class="main_item">
						<div class="main_item_name"><font i18n="web_port_title2">web_port_title2</font></div>
						<div class="main_item_content" >
							<input type="text" class="input_text" style="width:100px" id="web_port_modified" name="web_port_modified" /><span class="redcolorfont">*</span><font style="color: gray;" i18n="web_port_tips">web_port_tips</font>
						</div>
						<div id="webport-error" class="main_item_error_hint_extra"></div>
					</div>

					<div class="main_button">
						<div class="main_submit" style="width: 25%;"></div>
						<div class="main_submit" style="width: 75%;">
							<input type="button" class="input_button" id="web_port_apply" onclick="saveApply()" i18n="app_apply" i18n-set="value">&nbsp; &nbsp;
							<input type="button" class="input_button" id="web_port_cancel" onclick="window.location.reload()" i18n="app_cancel" i18n-set="value">
						</div>
					</div>
				</div>
			</div>


		</form>
	</body>
</html>
