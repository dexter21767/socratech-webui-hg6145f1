<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8'>
    <script language="javascript" type="text/javascript">
        document.write('<script  src="../js/jquery.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        document.write('<script  src="../js/xhr.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        document.write('<script  src="../js/aes.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        document.write('<script  src="../js/jquery.validate.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        document.write('<script  src="../language/messages_en.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        document.write('<script  src="../js/i18n.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        document.write('<script  src="../js/login_new.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        document.write('<script  src="../js/page_access_check.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        document.write('<link rel="stylesheet" type="text/css" href="../css/style.css?' + new Date().getTime() + '"><' + '/' + 'link>');
    </script>
    <script language="javascript" type="text/javascript">
        loginHtmlAccessCheck(goperator_name, "login.html");
    </script>
    <STYLE type="text/css">
        .STYLE1 {
            background-color: rgba(255, 98, 37, 1);
            border-radius: 8px;
            height: 48px;
            width: 176px;
            text-align: center;
            float: left;
            border: 0px;
            color: white;
            margin-left: 10px;
            z-index: 1;
            position: relative;
        }

        .STYLE1:hover {
            cursor: pointer;
        }

        .STYLE2 {
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            height: 48px;
            width: 176px;
            float: left;
            border: 0px;
            margin-left: 10px;
            color: white;
            z-index: 1;
            position: relative;
        }

        .STYLE2:hover {
            cursor: pointer;
        }

        .STYLE3 {
            width: 400px;
            margin: auto;
            margin-top: auto;
            margin-top: 200px
        }

        .copyright {
            position: absolute;
            color: rgba(255, 255, 255, 0.6);
            bottom: 20px;
            right: 90px
        }
        .date{
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }
        .language {
            color: rgba(255, 255, 255, 1);
            font-size: 12px;
            cursor: pointer;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="login-background">
    <div class="login-image">
        <div class="login-logo">
            <img src="../image/new_ui/logo_fiberhome_login.png" id="logo" style="height: 40px;">
            <div id="lang_div" class="language" style="display: none">
                <span id="EnglishModify" onclick="changeLanguage('en')">English</span> | 
                <span id="SpanishModify" onclick="changeLanguage('spain')">Español</span>
            </div>
        </div>
        <div class="STYLE3">
            <div class="login-title">
                <span i18n="welcome"></span>
            </div>
            <div style="margin-top: 30px;">
                <input name="user_name" id="user_name" autocomplete="off" type="text" class="input_login2"
                    placeholder="Username" ; onfocus="removetip()"
                    style="background-image: url('../image/new_ui/icon_username.png');"></input>
            </div>
            <div style="margin-top: 30px;">
                <input name="loginpp" id="loginpp" autocomplete="off" type="text" class="input_login2"
                    placeholder="Password" ;onfocus="removetip('pwd')"
                    style="background-image: url('../image/new_ui/icon_pwd.png');"></input>
                <div style="margin-top: 10px;">
                    <span id="tip"
                        style="color: red;font-size: 16px;z-index: 1;position: relative;display: inline-block;"></span>
                </div>
            </div>
            <div style="margin-top: 30px;margin-bottom:20px;display:none;" id="date_div">
                <div class="date">
                    Date: <font i18n="date_pwd_title" id="date_pwd"></font>
                </div>
            </div>
            <div style="margin-top: 20px">
                <input type="submit" onClick="cancel()" class="STYLE2" id="login_btn_reset" i18n="login_reset"
                    i18n-set="value">
                <input type="submit" onClick="onlogin()" class="STYLE1" id="login_btn_submit" i18n="login_submit"
                    i18n-set="value">
            </div>
        </div>
        <div class="copyright">
            <span>
                Copyright © Fiberhome 2023. All Rights Reserved.
            </span>
        </div>
        </div>
    </div>
</body>
<script type="text/javascript">
    setInterval(function() {
        $("#loginpp").removeClass("fh-text-security");
        if ($("#loginpp").val().length > 0) {
            if (!$("#loginpp").hasClass("fh-text-security")) {
                $("#loginpp").addClass("fh-text-security");
            }
        }
    }, 10);
</script>
</html>
