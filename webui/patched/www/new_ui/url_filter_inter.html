<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
	<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript " type="text/javascript">
		document.write('<script  src="../js/util.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/url_filter_inter.js?' + new Date().getTime() + '"><' + '/' + 'script>');
	</script>
</head>
<script type="text/javascript">
	setDomain("firewall");
</script>

<body>
	<div class='main_config_body'>
		<div class="main_item">
			<div class="main_item_name">
				<font i18n="URLenable_title">URLenable_title</font>
			</div>
			<div class="main_item_content">
				<div class="input_radio">
					<input type="radio" id="urlfilter_enable" name="urlfilter_enable" value="1" checked />
					<font i18n="firewall_enable">firewall_enable</font>&nbsp;&nbsp;
					<input type="radio" id="urlfilter_disable" name="urlfilter_enable" value="0" />
					<font i18n="firewall_disable">firewall_disable</font>
				</div>
			</div>
		</div>
		<div class="main_item">
			<div class="main_item_name">
				<font i18n="urldown_title">urldown_title</font>
			</div>
			<div class="main_item_content">
				<div class="input_radio">
					<input type="radio" id="urlfilter_mode_white" name="urlfilter_mode" value="white" checked />
					<font i18n="firewall_white">firewall_white</font>&nbsp;&nbsp;
					<input type="radio" id="urlfilter_mode_black" name="urlfilter_mode" value="black" />
					<font i18n="firewall_black">firewall_black</font>
				</div>
			</div>
		</div>
		<div class="main_submit_item" id="button_div">
			<div class="main_item_content">
				<input type="button" class="input_button" id="urlfilter_mode_apply" i18n="firewall_apply"
					i18n-set="value" onclick="EnableApply()" />
			</div>
		</div>
	</div>
	</br>
	</br>
	<div class='main_config_body' style="min-height: 320px;">
		<div style="float:left">
			<input type="button" i18n="firewall_add" i18n-set="value" id="fw_add" class="add_button"
				onClick="addfilter()">
			<input type="button" i18n="firewall_delete" i18n-set="value" id="fw_delete" class="delete_button"
				onClick="click_remove()">

		</div>
		<table width="100%" class="table_title_bg" cellspacing="1" cellpadding="0" border="0">
			<tr class="table_head_title">
				<td width="5%" align='center'>
					<input style="margin-top: 3px" type="checkbox" onclick="selectAll()" id="checkAll">
				</td>
				<td width="10%" align='center'>
					<font i18n="fw_filterID">fw_filterID</font>
				</td>
				<td width="40%" align='center' id="td_urlip">
					<font i18n="urlip">urlip</font>
				</td>
				<td width="25%" align='center' id="td_urltime">
					<font i18n="urltime">urltime</font>
				</td>
				<td width="10%" align='center' id="td_url_enableTitle">
					<font i18n="url_enableTitle">url_enableTitle</font>
				</td>
								<td width="8%" align='center'>
					<font i18n="operate"></font>
				</td>
			</tr>
			<tbody id='ipfilter_List' class="table_rule" style="font-size: 12px">
			</tbody>
		</table>
		<div id="image">
			<img src="../image/new_ui/no_data.png" style="width: 120px;">
			<span i18n="No Data">No Data</span>
		</div>
		</br>
		<form id="ip_filter_list_form">
			<div class="config_content" id="fw_config_form" style="display:none">
				<div class="main_item">
					<div class="main_item_title">
						<font id="title"></font>
						<img src="../image/new_ui/cancel.png" class="cancel_icon">
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<font i18n="urlip">urlip</font>
					</div>
					<div class="main_item_content_cfg">
						<input type="text" class="input_text" autocomplete="off" id="url_address" name="url_address" />
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<font i18n="url_start_time">url_start_time</font>
					</div>
					<div class="main_item_content_cfg">
					<div class="tip_text" id="tip_url_start_hour" i18n="tips">tips</div>
						<input type="text" class="input_text" value="00" autocomplete="off" id="url_start_hour"
							name="url_start_hour" style="width:135px" /> :
						<input type="text" class="input_text" value="00" autocomplete="off" id="url_start_min"
							name="url_start_min" style="width:135px" />
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<font i18n="url_end_time">url_end_time</font>
					</div>
					<div class="main_item_content_cfg">
					<div class="tip_text" id="tip_url_start_hour" i18n="tips">tips</div>
						<input type="text" class="input_text" value="23" autocomplete="off" id="url_end_hour"
							name="url_end_hour" style="width:135px" /> :
						<input type="text" class="input_text" value="59" autocomplete="off" id="url_end_min"
							name="url_end_min" style="width:135px" />
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<font i18n="URLenable_title">URLenable_title</font>
					</div>
					<div class="main_item_content_cfg">
						<select id="enable" class="select">
							<option value="1" i18n="firewall_enable">Enable</option>
							<option value="0" i18n="firewall_disable">Disable</option>
						</select>
					</div>
				</div>
				<div class="main_submit_item">
					<div class="main_submit" style="float: right;">
						<input type="button" class="input_button_cfg" id="url_apply" i18n="firewall_apply" i18n-set="value"
							onclick="doSave()" />
					</div>
				</div>
			</div>
		</form>
	</div>
</body>
<div id='loading_div' style='display:none'>

</div>

</html>
