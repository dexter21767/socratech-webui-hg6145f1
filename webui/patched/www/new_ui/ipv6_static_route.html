<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
	<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript " type="text/javascript">
		document.write('<script  src="../js/util.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/ipv6_static_route.js?' + new Date().getTime() + '"><' + '/' + 'script>');
	</script>

</head>
<script type="text/javascript">
	setDomain("firewall");
</script>

<body class='main_config_body'>
	<form id="ip_filter_list_form" method="post">
		<div style="float:left">
			<input type="button" i18n="firewall_add" i18n-set="value" id="fw_add" class="add_button"
				onClick="addfilter()">
			<input type="button" i18n="firewall_delete" i18n-set="value" id="fw_delete" class="delete_button"
				onClick="click_remove()">
		</div>
		<br />
		<table width="100%" class="table_title_bg" cellspacing="1" cellpadding="0" border="0">
			<tr class="table_head_title">
				<td width="5%" align='center'>
					<input style="margin-top: 3px" type="checkbox" onclick="selectAll()" id="checkAll">
				</td>
				<td width="10%" align='center'>
					<font i18n="WanName_title">wanName_title</font>
				</td>
				<td width="30%" align='center'>
					<font i18n="DstPrefix_title">DstPrefix_title</font>
				</td>
				<td width="26%" align='center'>
					<font i18n="NextHop_title">NextHop_title</font>
				</td>
				<td width="10%" align='center'>
					<font i18n="ipv6StaticRoute_state">ipv6StaticRoute_state</font>
				</td>
				<td width="8%" align='center'>
					<font i18n="operate"></font>
				</td>
			</tr>
			<tbody id='ipfilter_List' class="table_rule" style="font-size: 12px">
			</tbody>
		</table>
		</br>
		<div id="image">
			<img src="../image/new_ui/no_data.png" style="width: 120px;">
			<span i18n="No Data">No Data</span>
		</div>
		<div class="config_content" id="fw_config_form" style="display:none">
			<div class="main_item">
				<div class="main_item_title">
					<font id="title"></font>
					<img src="../image/new_ui/cancel.png" class="cancel_icon">
				</div>
			</div>
			<div class="main_item_cfg">
				<div class="main_item_name_cfg">
					<font i18n="WanName_title">WanName_title</font>
				</div>
				<div class="main_item_content_cfg">
					<select id="wan_name" class="select">
					</select>
				</div>
				<div id="MinSourceAddress-error" class="main_item_error_hint_extra"></div>
			</div>
			<div class="main_item_cfg">
				<div class="main_item_name_cfg"><span class="redcolorfont">*</span>
					<font i18n="DstPrefix_title">DstPrefix_title</font>
				</div>
				<div class="main_item_content_cfg">
					<input type="text" class="input_text" autocomplete="off" id="DstPrefix" name="DstPrefix" />

				</div>
				<div id="MinSourcePort-error" class="main_item_error_hint_extra"></div>
			</div>
			<div class="main_item_cfg">
				<div class="main_item_name_cfg">
					<font i18n="NextHop_title">NextHop_title</font>
				</div>
				<div class="main_item_content_cfg">
					<input type="text" class="input_text" autocomplete="off" id="NextHop" name="NextHop" />

				</div>
				<div id="MinDestinationAddress-error" class="main_item_error_hint_extra"></div>
			</div>
			<div class="main_submit_item">
				<div class="main_submit" style="float: right;">
					<input type="button" id="firewall_apply" class="input_button_cfg" i18n="firewall_apply" i18n-set="value"
						onclick="doSave()" />
				</div>
			</div>
		</div>
	</form>
</body>
<div id='loading_div' style='display:none'>
</div>
</html>
