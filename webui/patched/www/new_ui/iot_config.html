<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
				document.write('<script  src="../js/aes.js?' + new Date().getTime() + '"><' + '/' + 'script>');
			document.write('<script  src="../js/iot_config.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("internet");
	</script>
	<body class='main_config_body'>
		<form id="Iot_form" method="post">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name"><font i18n="IOT_Agent_Enable">IOT_Agent_Enable</font></div>
					<div class="main_item_content">
						<div class="input_radio">
						<input type="radio" id="iot_enable" name="iot_enable" value="1"/><font i18n="iot_enable">iot_enable</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
						<input type="radio" id="iot_disable" name="iot_enable" value="0"/><font i18n="iot_disable">iot_disable</font>
						</div>
					</div>
				</div>
			<div class="main_submit_item">
				<div class="main_item_content">
					<input type="button" id="iot_enable_apply" class="input_button" i18n="iot_apply" i18n-set="value"
						onclick="save_enable_apply()" />
				</div>
			</div>
			<div id="line">
				<img src="../image/new_ui/line.png"
					style="width: 100%;height: 1px;margin-top: 30px;margin-bottom: 30px;">
			</div>
				<div class="main_item">
					<div class="main_item_name"><span class="redcolorfont">*</span><font i18n="iot_url">iot_url</font></div>
					<div class="main_item_content">
						<input type="text" class="input_text" name="iot_url" id="iot_url"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><span class="redcolorfont">*</span><font i18n="iot_password">iot_password</font></div>
					<div class="main_item_content">
						<input type="text" class="input_text fh-text-security" name="iot_password" id="iot_password" autocomplete="off" />
					</div>
				</div>
				<div class="main_submit_item">
					<div class="main_item_content">
						<input type="button" id="iot_apply" class="input_button" i18n="iot_apply" i18n-set="value"
							onclick="save_apply()" />
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
