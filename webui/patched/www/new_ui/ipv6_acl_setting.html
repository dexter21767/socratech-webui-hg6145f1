<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
	<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript " type="text/javascript">
		document.write('<script  src="../js/util.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/ipv6_acl_setting.js?' + new Date().getTime() + '"><' + '/' + 'script>');
	</script>

</head>
<script type="text/javascript">
	setDomain("firewall");
</script>

<body>
	<div class='main_config_body'>
		<div class="main_item">
			<div class="main_item_name">
				<font i18n="ipv6_acl_Enable_title">ipv6_acl_Enable_title</font>
			</div>
			<div class="main_item_content">
				<div class="input_radio">
					<input type="radio" id="acl_enable" name="acl_enable" value="1" />
					<font i18n="acl_Enable">acl_Enable</font>&nbsp;&nbsp;
					<input type="radio" id="acl_disable" name="acl_enable" value="0" />
					<font i18n="acl_Disable">acl_Disable</font>
				</div>
			</div>
		</div>
		<div class="main_submit_item">
			<div class="main_item_content">
				<input type="button" id="acl_enable_apply" class="input_button" i18n="firewall_apply" i18n-set="value"
					onclick="EnableApply()" />
			</div>
		</div>
	</div>
	</br>
	</br>
	<div class='main_config_body' style="min-height: 320px;">
		<div style="float:left">
			<input type="button" i18n="firewall_add" i18n-set="value" id="fw_add" class="add_button"
				onClick="addfilter()">
			<input type="button" i18n="firewall_delete" i18n-set="value" id="fw_delete" class="delete_button"
				onClick="click_remove()">
		</div>
		<table width="100%" class="table_title_bg" cellspacing="1" cellpadding="0" border="0">
			<tr class="table_head_title">
				<td width="5%" align='center'>
					<input style="margin-top: 3px" type="checkbox" onclick="selectAll()" id="checkAll">
				</td>
				<td width="2%" align='center'>
					<font i18n="fw_aclID">fw_aclID</font>
				</td>
				<td width="12%" align='center'>
					<font i18n="fw_acl_active">fw_acl_active</font>
				</td>
				<td width="26%" align='center'>
					<font i18n="fw_sourceIPv6">fw_sourceIPv6</font>
				</td>
				<td width="10%" align='center'>
					<font i18n="fw_acl_protocolTitle">fw_acl_protocolTitle</font>
				</td>
				<td width="26%" align='center'>
					<font i18n="fw_acl_interface">fw_acl_interface</font>
				</td>
				<td width="8%" align='center'>
					<font i18n="operate"></font>
				</td>
			</tr>
			<tbody id='ipfilter_List' class="table_rule" style="font-size: 12px">
			</tbody>
		</table>
		<div id="image">
			<img src="../image/new_ui/no_data.png" style="width: 120px;">
			<span i18n="No Data">No Data</span>
		</div>
		</br>
		<fh-fo-rm id="acl_list_form">
			<div class="config_content" id="fw_config_form" style="display:none">
				<div class="main_item">
					<div class="main_item_title">
						<font id="title"></font>
						<img src="../image/new_ui/cancel.png" class="cancel_icon">
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<font i18n="fw_acl_active">fw_acl_active</font>
					</div>
					<div class="main_item_content_cfg">
						<select id="acl_active" name="acl_active" class="select">
							<option value="1" i18n="acl_yes">Yes</option>
							<option value="0">No</option>
						</select>
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<font i18n="fw_srcIPv6Title">fw_srcIPv6Title</font>
					</div>
					<div class="main_item_content_cfg">
						<input type="text" class="input_text" autocomplete="off" id="acl_sourceIPStart"
							name="SourceIPStart" style="width:150px" /> --
						<input type="text" class="input_text" autocomplete="off" id="acl_sourceIPEnd" name="SourceIPEnd"
							style="width:150px" />
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<font i18n="fw_acl_interface">fw_acl_interface</font>
					</div>
					<div class="main_item_content_cfg">
						<select id="acl_direction" class="select">
							<option value="1">WAN</option>
							<option value="0">LAN</option>
						</select>
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<font i18n="fw_acl_protocolTitle">fw_acl_protocolTitle</font>
					</div>
					<div class="main_item_content_cfg">
						<select id="acl_protocol" class="select">
							<option value="HTTP">HTTP</option>
							<option value="ICMP">ICMP</option>
							<option id="dhcpv6" style="display: none;" value="DHCPV6">DHCPV6</option>
						</select>
					</div>
				</div>
				<div class="main_submit_item">
					<div class="main_submit" style="float: right;">
						<input type="button" id="firewall_apply" class="input_button_cfg" i18n="firewall_apply"
							i18n-set="value" onclick="doSave()" />
					</div>
				</div>
			</div>
		</fh-fo-rm>
	</div>
</body>
<div id='loading_div' style='display:none'>

</div>

</html>
