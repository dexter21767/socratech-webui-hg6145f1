<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
	<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript " type="text/javascript">
		document.write('<script  src="../js/util.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/dhcp_filter_inter.js?' + new Date().getTime() + '"><' + '/' + 'script>');
	</script>
</head>
<script type="text/javascript">
	setDomain("firewall");
</script>
<body>
	<div class='main_config_body'>
		<div class="main_item">
			<div class="main_item_name">
				<font i18n="dhcpaddrenable_title">dhcpaddrenable_title</font>
			</div>
			<div class="main_item_content">
				<div class="input_radio">
					<input type="radio" id="dhcp_filter_enable" name="dhcp_filter_enable" value="1" />
					<font i18n="firewall_enable">firewall_enable</font>&nbsp;&nbsp;
					<input type="radio" id="dhcp_filter_disable" name="dhcp_filter_enable" value="0" />
					<font i18n="firewall_disable">firewall_disable</font>
				</div>
			</div>
		</div>
		<div class="main_item">
			<div class="main_item_name">
				<font i18n="dhcpaddrdown_title">dhcpaddrdown_title</font>
			</div>
			<div class="main_item_content">
				<div class="input_radio">
					<input type="radio" id="dhcp_filter_mode_white" name="dhcp_filter_mode" value="white" />
					<font i18n="firewall_white">firewall_white</font>&nbsp;&nbsp;
					<input type="radio" id="dhcp_filter_mode_black" name="dhcp_filter_mode" value="black" />
					<font i18n="firewall_black">firewall_black</font>
				</div>
			</div>
		</div>
		<div class="main_submit_item" id="button_div">
			<div class="main_item_content">
				<input type="button" id="dhcp_filter_mode_apply" class="input_button" i18n="firewall_apply"
					i18n-set="value" onclick="EnableApply()" />
			</div>
		</div>
	</div>
	</br>
	</br>
	<div class='main_config_body' style="min-height: 320px;">
		<div style="float:left">
			<input type="button" i18n="firewall_add" i18n-set="value" id="fw_add" class="add_button"
				onClick="addfilter()">
			<input type="button" i18n="firewall_delete" i18n-set="value" id="fw_delete" class="delete_button"
				onClick="click_remove()">

		</div>
		<table width="100%" class="table_title_bg" cellspacing="1" cellpadding="0" border="0">
			<tr class="table_head_title">
				<td width="5%" align='center'>
					<input style="margin-top: 3px" type="checkbox" onclick="selectAll()" id="checkAll">
				</td>
				<td width="10%" align='center'>
					<font i18n="fw_filterID">fw_filterID</font>
				</td>
				<td width="30%" align='center'>
					<font i18n="macaddr">macaddr</font>
				</td>
				<td width="30%" align='center'>
					<font i18n="dhcp_lan_enable">firewall_enable</font>
				</td>
				<td width="8%" align='center'>
					<font i18n="operate"></font>
				</td>
			</tr>
			<tbody id='dhcp_filter_List' class="table_rule" style="font-size: 12px">
			</tbody>
		</table>
		<div id="image">
			<img src="../image/new_ui/no_data.png" style="width: 120px;">
			<span i18n="No Data">No Data</span>
		</div>
		</br>
		<form id="dhcp_filter_list_form">
			<div class="config_content" id="fw_config_form" style="display:none">
				<div class="main_item">
					<div class="main_item_title">
						<font id="title"></font>
						<img src="../image/new_ui/cancel.png" class="cancel_icon">
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<span class="redcolorfont">*</span>
						<font i18n="macaddr">macaddr</font>
					</div>
					<div class="main_item_content_cfg" id="macaddr_content">
						<div class="tip_text" id="tip_dhcp_mac_address" i18n="macaddr_macTips">macaddr_macTips</div>
						<input type="text" class="input_text" autocomplete="off" id="dhcp_mac_address"
							name="dhcp_mac_address"  />
					</div>
				</div>
				<div class="main_item_cfg">
					<div class="main_item_name_cfg">
						<font i18n="dhcp_lan_enable">firewall_enable</font>
					</div>
					<div class="main_item_content_cfg">
						<select id="dhcp_enable" class="select">
							<option value="1" i18n="firewall_enable">Enable</option>
							<option value="0" i18n="firewall_disable">Disable</option>
						</select>
					</div>
				</div>
				<div class="main_submit_item">
					<div class="main_submit" style="float: right;">
						<input type="button" id="firewall_apply" class="input_button_cfg" i18n="firewall_apply"
							i18n-set="value" onclick="doSave()" />
					</div>
				</div>
			</div>
		</form>
	</div>
</body>
<div id='loading_div' style='display:none'>

</div>
</html>
