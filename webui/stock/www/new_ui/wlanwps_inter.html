<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
	<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript " type="text/javascript">
		document.write('<script  src="../js/util.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/wlanwps_inter.js?' + new Date().getTime() + '"><' + '/' + 'script>');
	</script>
</head>
<script type="text/javascript">
	setDomain("wps");
</script>

<body class='main_config_body'>
	<form id="wlanAdv_settings_form">
		<br>
		<div class="main_content">
			<div class="main_item" id="div_wps_bandSelec">
				<div class="main_item_name">
					<font i18n="wps_bandSelec_head">Band Select</font>
				</div>
				<div class="main_item_content">
					<select name="wifi_sel" id="wifi_sel" class="select">
						<option value="1">2.4G</option>
						<option value="5">5G</option>
					</select>
				</div>
			</div>
			<br id="br_id" />
			<div class="table_bg" border="0" cellpadding="0" cellspacing="1" width="100%">
				<div class="main_item">
					<div class="main_item_name">
						<font i18n="WPS_enable_head">WPS_enable_head</font>
					</div>
					<div class="main_item_content">
						<div class="input_radio">
							<input type="radio" class="radio" name="wps_enable" id="wps_enable" value="1">
							<font i18n="wps_enable_title">Enable</font>&nbsp;&nbsp;&nbsp;
							<input type="radio" class="radio" name="wps_enable" id="wps_disable" value="0">
							<font i18n="wps_disable_title">Disable</font>
						</div>
					</div>
				</div>
				<div class="main_submit_item" id="wireless_apply">
					<div class="main_item_content">
						<input type="button" class="input_button" id="wps_enable_apply" i18n="wps_apply"
							i18n-set="value" onclick="saveApplyEnable()" />&nbsp; &nbsp;
					</div>
				</div>
			</div>
			<div id="line">
				<img src="../image/new_ui/line.png"
					style="width: 100%;height: 1px;margin-top: 60px;margin-bottom: 30px;">
			</div>
			<div class="table_bg" border="0" cellpadding="0" cellspacing="1" width="100%">
				<div class="main_item">
					<div class="main_item_name">
						<font i18n="wps_statetitle">wps_statetitle</font>
					</div>
					<div class="main_item_content">
						<div id="wps_state" class="disabled_text"></div>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">
						<font i18n="WPS Method"></font>
					</div>
					<div class="main_item_content">
						<div class="input_radio">
							<input type="radio" class="radio" name="wps_style" id="wps_style_p" value="PIN" onclick="showWPSInfo()">
							<font i18n="wps_PINtitel">wps_PINtitel</font>&nbsp;&nbsp;&nbsp;&nbsp;
							<input type="radio" class="radio" name="wps_style" id="wps_style_b" value="button"
								onclick="showWPSInfo()">
							<font i18n="wps_buttontitel">wps_buttontitel</font>
						</div>
					</div>
				</div>
				<div class="main_item" id="pin_code_div">
					<div class="main_item_name"><span class="redcolorfont">*</span><span i18n="pin_code">PIN Code</span>
					</div>
					<div class="main_item_content">
						<div class="tip_text" id="tip_wps_PIN" i18n="8-digit number">8-digit number</div>
						<input type="text" class="input_text" maxlength="8" autocomplete="off" id="wps_PIN"
							name="wps_PIN" />
					</div>
				</div>
			</div>
			<div class="main_item_content_tip" style="display: none" id="multiap_tip">
				<p style="color:red; font-weight: bold">Multi-AP is Enable ! You can't configure wifi parameters !</p>
				&nbsp;
			</div>
			<div class="main_submit_item" id="wireless_apply2">
				<div class="main_item_content">
					<input type="button" class="input_button" id="WPS_connect" i18n="WPSconnect" i18n-set="value"
						onclick="saveApply()" />
				</div>
			</div>
		</div>
	</form>
</body>

</html>
