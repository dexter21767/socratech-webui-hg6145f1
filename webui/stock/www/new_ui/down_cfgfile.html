<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
	<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript " type="text/javascript">
		document.write('<script  src="../js/util.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/down_cfgfile.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/jquery.form.js?'+new Date().getTime()+'"><'+'/'+'script>');
	</script>
</head>
<script type="text/javascript">
	setDomain("restore");
</script>
<style type="text/css">
	#progress {
		height: 24px;
		width: 200px;
		border: none;
	}

	.inner-progress {
		background: #2C5EA4;
	}

	.button1 {
		border-radius: 8px;
		width: 235px;
		height: 40px;
		border: 1px solid rgba(255, 255, 255, 0.2);
		background-color: #2e2e31;
		color: rgba(255, 255, 255, 0.8);
		font-size: 14px;
		background-image: url('../image/new_ui/download_icon.png');
		background-repeat: no-repeat;
		background-position-x: 10px;
		background-position-y: center;
		text-indent: 20px;
	}

	.button1:hover {
		cursor: pointer;
	}
</style>
<style type="text/css">
	.type-file-box {
		position: absolute;
		width: 260px
	}

	input {
		vertical-align: middle;
		margin: 0;
		padding: 0
	}

	.type-file-text {
		height: 32px;
		border: 1px solid #cdcdcd;
		width: 300px;
		border: 1px solid rgba(255, 255, 255, 0.5);
		color: rgba(255, 255, 255, 0.8);
		font-size: 14px;
		font-family: PingFangSC-Regular;
		background-color: #2e2e31;
		outline: none;
		text-indent: 5px;
	}

	.type-file-button {
		background-color: rgba(255, 255, 255, 0.2);
		border: none;
		border-radius: 8px;
		height: 40px;
		width: 240px;
		color: rgba(255, 255, 255, 0.8);
		font-size: 14px;
		background-image: url('../image/new_ui/download.png');
		background-repeat: no-repeat;
		background-position-x: 60px;
		background-position-y: center;
	}

	img,
	.type-file-file2,
	.type-file-file1,
	.type-file-button,
	.type-file-file:hover {
		cursor: pointer;
	}

	.type-file-file1 {
		position: fixed;
		height: 14px;
		opacity: 0;
		width: 14px;
		margin-left: -16px;
		margin-top: 17px;
	}

	.type-file-file2 {
		position: fixed;
		height: 40px;
		opacity: 0.01;
		width: 320px;
		margin-left: 40px;
  		margin-top: -38px;

	}

	.ledstate_tip {
		height: 54px;
		line-height: 56px;
		font-size: 14px;
		font-family: PingFangSC-Regular;
		color: rgba(255, 255, 255, 0.8);
		display: block;
		margin-bottom: -10px;
	}

	input::placeholder{
		text-align: left;
	}
</style>

<body>
	<div class="main_config_body management_half_div" style="float: left;">
		<form id="file_form" enctype="multipart/form-data" method="post">
			<div id="update_conf" style="width: 367px;">
				<div>
					<img src="../image/new_ui/update_conf.png">
				</div>
				<div style="margin-left: 40px;width: 350px;">
					<div style="float: left;margin-top: 8px;">
					<font style="color: rgba(255, 255, 255, 1);margin-left: -80px;font-size: 14px;
					font-family: PingFangSC-Regular"><span i18n="File Path">File Path</span>:</font>&nbsp&nbsp
					</div>
					<input type='text' name='textfield' id='textfield' class='type-file-text' readonly placeholder="choose configuration file"/>

					<img src="../image/new_ui/file.png" id="edit" style="margin-left: 5px;width: 15px;height: 15px;">
					<!-- <input name="fileField" type="file" class="type-file-file1" id="fileField"
						onchange="javascript:document.getElementById('textfield').value=this.value.slice(12);" /> -->
					<img src="../image/new_ui/delete.png" id="del" style="margin-left: 5px;width: 15px;height: 15px;"
						onclick="deleteFile()">
				</div>
				<div>
					<input name="uploadfile" type="file" class="type-file-file2" id="uploadfile" size="28"
						onchange="javascript:document.getElementById('textfield').value=this.value.slice(12);" />
				</div>
				<div>
					<input type="submit" class="input_button" style="margin-top: 10px;margin-left: 70px;" id="upload_button" i18n="Upload File" i18n-set="value"/>
				</div>
			</div>
		</form>
	</div>
	<div class="main_config_body management_half_div" style="float: right">
		<form id="downCfgForm">
			<div id="download_conf" style="width: 367px;">
				<div>
					<img src="../image/new_ui/download_conf.png">
				</div>
				<div class="main_save" style="margin-left: 65px;margin-top: 14px;">
					<input type="button" class="input_button" onclick="down_cfgfile()" id="download_button"
						i18n="download_file_apply" i18n-set="value">
				</div>
			</div>
		</form>
	</div>
</body>

</html>
