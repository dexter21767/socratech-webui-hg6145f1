<!DOCTYPE html
	PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
	<meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
	<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
	<script language="javascript " type="text/javascript">
		document.write('<script  src="../js/util.js?' + new Date().getTime() + '"><' + '/' + 'script>');
		document.write('<script  src="../js/multi_ap_enable.js?' + new Date().getTime() + '"><' + '/' + 'script>');
	</script>
</head>
<script type="text/javascript">
	setDomain("wireless");
</script>

<body class='main_config_body'>
	<form id="multi_ap_form">
		<div class="main_content">
			<div class="main_item">
				<div class="main_item_name" id="multi_ap_enable_title">
					<font i18n="multi_ap_enable__title">multi_ap_enable__title</font>
				</div>
				<div class="main_item_content">
					<div class="input_radio">
						<input type="radio" name="firewall_enable" id="firewall_enable" value="1" onclick="showMeshModeInfo()"/>
						<font i18n="multi_ap_enable">multi_ap_enable</font>
						<input type="radio" name="firewall_enable" id="firewall_disable" value="0" onclick="showMeshModeInfo()"/>
						<font i18n="multi_ap_disable">multi_ap_disable</font>
					</div>
				</div>
			</div>
				<div class="main_item" id="Roaming_Param_div" style="display:none">
					<div class="main_item_name"><span class="redcolorfont">*</span><font i18n="Roaming_Param_title">Roaming_Param_title</font></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="Roaming_Param" name="Roaming_Param"/>
					</div>
				</div>
			<div class="main_item" id="current_mode_div" style="display: none;">
				<div class="main_item_name">
					<font i18n="current_mode">current_mode</font>
				</div>
				<div class="main_item_content">
					<div id="current_mode" class="disabled_text" name="current_mode" style="color: rgba(255, 255, 255, 0.8);"></div>
				</div>
			</div>
			<div class="main_item" id="mode" style="display:none">
				<div class="main_item_name" id="multi_ap_mode">
					<font i18n="multi_ap_mode_title">multi_ap_mode_title</font>
				</div>
				<div class="main_item_content">
					<select id="multiap_mode" name="multiap_mode" class="select">
						<option value="3" i18n="Controller">Controller</option>
						<option value="2" i18n="Agent">Agent</option>
					</select>
				</div>
			</div>
			<div class="main_submit_item" id="button_div">
				<div class="main_item_content" id="wireless_apply_cancel">
					<input type="button" id="wireless_apply" class="input_button" i18n="wireless_apply" i18n-set="value"
						onclick="save_apply()" />
				</div>
			</div>
		</div>
	</form>
</body>

</html>
