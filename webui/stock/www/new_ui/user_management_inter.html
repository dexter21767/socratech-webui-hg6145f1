<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>

<head>
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
    <script language="javascript " type="text/javascript">
        document.write('<script  src="../js/util.js?' + new Date().getTime() + '"><' + '/' + 'script>');
            document.write('<script  src="../js/aes.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        document.write('<script  src="../js/user_management_inter.js?' + new Date().getTime() + '"><' + '/' + 'script>');
        
    </script>
</head>

<body class='main_config_body'>
    <form id="userManagementForm_lan" method="post">
        <div class="table_bg" border="0" cellpadding="0" cellspacing="1" width="100%">
            <div class="main_item">
                <div class="main_item_name">
                    <font i18n="account_user">account_user</font>
                </div>
                <div class="main_item_content">
                    <div id="username" class="disabled_text" name="username" style="color: rgba(255, 255, 255, 0.8);"></div>
                </div>
            </div>
            <div class="main_item" id="old_Lan_Pwd" style="display:none">
                <div class="main_item_name">
                    <span class="redcolorfont">*</span>
                    <font i18n="old_lan_password">Old LAN password</font>
                </div>
                <div class="main_item_content">
                    <input class="input_text fh-text-security" type="text" autocomplete="off" readonly
                        onfocus="removeAttribute('readonly')" name="lan_old_password" id="lan_old_password"/>
                </div>
            </div>
            <div class="main_item">
                <div class="main_item_name">
                    <span class="redcolorfont">*</span>
                    <font i18n="new_lan_password">New LAN password</font>
                </div>
                <div class="main_item_content"><input class="input_text fh-text-security" type="text" autocomplete="off" readonly
                        onfocus="removeAttribute('readonly')" name="lan_new_password" id="lan_new_password" />
                </div>
            </div>
            <div class="main_item">
                <div class="main_item_name">
                    <span class="redcolorfont">*</span>
                    <font i18n="lan_password_confirm">LAN Password Confirm</font>
                </div>
                <div class="main_item_content"><input class="input_text fh-text-security" type="text" autocomplete="off" readonly
                        onfocus="removeAttribute('readonly')" name="lan_confirm_password" id="lan_confirm_password" />
                </div>
            </div>
            <div class="main_submit_item">
                <div class="main_item_content">
                    <input type="button" class="input_button" id="apply" name="apply" onclick="lan_saveApply()"
                        i18n="modifyPassword" i18n-set="value" />
                </div>
            </div>
        </div>
    </form>

</body>

</html>
