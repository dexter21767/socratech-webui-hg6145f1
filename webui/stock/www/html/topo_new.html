        function hostDataToTopoData(hostdata, topodata) {
            for (var i = 0; i < hostdata.length; i++) {
                if (hostdata[i].Active == 1) {
                    for (var j = 0; j < topodata.topo.length; j++) {
                        if (hostdata[i].MACAddress == topodata.topo[j].mac) {
                            topodata.topo[j].ipv4 = hostdata[i].IPAddress == "" ? hostdata[i].IPv6Address : hostdata[i].IPAddress;
                        }
                        for (var k = 0; k < topodata.topo[j].sta.length; k++) {
                            if (hostdata[i].MACAddress == topodata.topo[j].sta[k].mac) {
                                topodata.topo[j].sta[k].ipv4 = hostdata[i].IPAddress == "" ? hostdata[i].IPv6Address : hostdata[i].IPAddress;
                            }
                        }
                    }
                }
            }
			//console.log(topodata);
            return topodata;
        }

        function getFhDeviceType(e) {
            let _deviceType = 5 // 默认为无线下挂设备
			if(e.InterfaceType != 'Ethernet' && e.DeviceType != 'Agent' && e.DeviceType != 'AP')
			{
				e.DeviceType = 'Phone';
			}
            switch (e.DeviceType) {
                case 'Phone':
                    _deviceType = 2 // 手机
                    break;
                case 'Computer':
                    _deviceType = 4 // 电脑
                    break;
                case 'AP':
				case 'Agent':
                    _deviceType = 1 // AP
                    break;
                default:
                    _deviceType = e.InterfaceType === "Ethernet" ? 4 : 2 // 改为默认电脑/手机   无线/有线下挂设备
                    break;
            }
			if(gOperatorName == "CHL_ENTEL" || gOperatorName == "MEX_TP")
			{
				if(e.InterfaceType != 'Ethernet' && e.DeviceType != 'Agent' && e.DeviceType != 'AP')
				{
					_deviceType = 5;
				}
			}
            return _deviceType
        }

        /*设备类型改由从topo节点判断*/
        function getTopoDeviceType(accessType) {
            var type;
            if(accessType == 1){
                type = 4;
            }
            else if(accessType == 2 || accessType == 3){
                if(gOperatorName == "CHL_ENTEL" || gOperatorName == "MEX_TP"){
                    type = 5;
                }else{
                    type = 2;
                }
            }
            return type;
        }

        function getFhtopoAccessType(e) {
            var accessType = 1;
            if(e.OperatingFrequencyBand === 'Wired')
            {//有线
                accessType = 1;
            }
            else
            {// 无线
                if(e.OperatingFrequencyBand === '2.4GHz')
                {
                    accessType = 2
                }
                else if(e.OperatingFrequencyBand === '5GHz')
                {
                    accessType = 3
                }
            }

            return accessType
        }
		
		function getFhtopoApAccessType(e) {
            var accessType = 1;
            if(e.BackhaulLinkType === 'Wired')
            {//有线
                accessType = 1;
            }else if (e.BackhaulLinkType === '2.4GHz') {
                accessType = 2;
            }else if (e.BackhaulLinkType === '5GHz') {
                accessType = 3;
            }else if (e.BackhaulLinkType === 'PON' || e.BackhaulLinkType === 'pon') {
                accessType = 4;
            }

            return accessType
        }
		
		function getattachAccessType(e) {
            var accessType = 1;
            if(e.AccessType == 'Ethernet')
            {//有线
                accessType = 1;
            }else if (e.AccessType == '2.4G') {
                accessType = 2;
            }else if (e.AccessType == '5G') {
                accessType = 3;
            }
            return accessType
        }


        function createFhTopoStaData(radiodata, router, hostdata, nodeindex) {
            for (var j = 0; j < radiodata.length; j++) {
                var accessType = getFhtopoAccessType(radiodata[j]);
                var apdata = radiodata[j].apdata;
				console.log(apdata.length);
                for (var k = 0; k < apdata.length; k++) {
                    var stadata = apdata[k].stadata;
					console.log(stadata.length);
                    for (var l = 0; l < stadata.length; l++) {   //sta
                       // alert(JSON.stringify(stadata))
                        if(gOperatorName != "TH_AIS"){
                            stadata[l].OperatingStandard = radiodata[j].OperatingStandards;
                        }
                        console.log(g_subRouter_Array)
                        var repeatFlag = false
                        for(var n = 0; n < g_subRouter_Array.length; n++ ){
                            if(stadata[l].MACAddress.toUpperCase() == g_subRouter_Array[n].toUpperCase()){
                                repeatFlag = true;
                                break
                            }
                        }
						for (var m = 0; m < hostdata.length; m++) {
                            if (stadata[l].Active == 1  && stadata[l].MACAddress.toUpperCase() == hostdata[m].MACAddress.toUpperCase()
                                && repeatFlag == false) {
                                router.sta.push({
                                    accessType: accessType,
                                    mac: stadata[l].MACAddress,
                                    ipv4: stadata[l].IPv4Address,
                                   // linkSpeed:Math.floor(Number(stadata[l].PHYRate)/1000),
                                    rssi:stadata[l].SignalStrength,
                                    _80211mode:stadata[l].OperatingStandard,
                                    sta: [],
                                    name: stadata[l].HostName,
                                    nodeIndex: nodeindex,
                                    deviceType: getTopoDeviceType(accessType),
                                    UpSpeed:stadata[l].upSpeed,
                                    security:stadata[l].Security,
                                    OnlineTime:"",
									linkSpeed:""
                                });
                            }
                        }
                    }
                }
            }
        }

        function createFhTopoData(topodata, macvalue, topoarray,hostdata, nodeindex) {
            var _topodata = topodata;
            g_subRouter_Array = [];
            for(var i = 0; i < topodata.length; i++){
                if (topodata[i].Active == 1) {
                    g_subRouter_Array.push(topodata[i].MACAddress)
                }
            }
            for (var i = 0; i < topodata.length; i++) {
                if (topodata[i].Active == 1) {
                    if (macvalue == topodata[i].MACAddress && nodeindex == 1) {  //main router
                        var radiodata = topodata[i].radiodata;
                        createFhTopoStaData(radiodata, topoarray[0], hostdata,nodeindex + 1);
                    }
                   for (var m = 0; m < hostdata.length; m++) {
                        if (macvalue == topodata[i].ParentMACAddress && topodata[i].MACAddress.toUpperCase() == hostdata[m].MACAddress.toUpperCase()) {   //sub router
                        
                        var subRouter = {
                            accessType: getFhtopoApAccessType(topodata[i]),
                            mac: topodata[i].MACAddress,
                            ipv4: topodata[i].IPv4Address,
							//linkSpeed: Math.floor(Number(topodata[i].PHYRate)/1000),
                            rssi:topodata[i].BackhaulSignalStrength,
							_80211mode:getFhtopoAp80211mode(topodata[i]),
							Version: topodata[i].SoftwareVersion,
							OnlineTime:"",
                            linkSpeed:"",
                            sta: [],
                            name: "",
                            nodeIndex: nodeindex + 1,
                            deviceType: 1,
                            downSpeed:topodata[i].downSpeed,
                            version:g_lan_data.lan_ipv4.software_version
                        }
                        var radiodata = topodata[i].radiodata;
                            createFhTopoStaData(radiodata, subRouter, hostdata,nodeindex + 2);
                        	topoarray.push(subRouter);
                            createFhTopoData(_topodata, topodata[i].MACAddress, topoarray,hostdata, nodeindex + 1);
                        }
                    }
                }
            }
        }

        function handleFhTopoData(hostdata, topodata) {
            var _topo = [
                {   //main router
                    accessType: 0,
                    mac: g_lan_data.lan_ipv4.brmac,
                    ipv4: g_lan_data.lan_ipv4.IPInterfaceIPAddress,
                    linkSpeed: "0",
                    sta: [],
					name: gModelName,
                    nodeIndex: 1,
                    deviceType: 1,
                    version:g_lan_data.lan_ipv4.software_version
                }
            ]
            var _topodata = topodata.topodata;
            createFhTopoData(_topodata, g_lan_data.lan_ipv4.brmac, _topo, hostdata, 1);
           
            return {
                topo: hostDataToFhTopoData(hostdata,_topo)
            }
        }
		
		function adjustHeightCommon() {
			$(".fh_content_common").css("height", "auto");
			if ($(".fh_content_common").height() < 350) {
				$(".fh_content_common").css("height", "348px");
			}
			
			var bh = document.documentElement.clientHeight || document.body.clientHeight;
			var dh = $(".fh_container").height();
			
			if(bh > dh) {
				var h = bh - dh + $(".fh_content_common").height();
				$(".fh_content_common").height(h);
			}
		}
		
		function getFhtopoAp80211mode(e) {
			var OperatingStandards = "";
			var radiodata = e.radiodata;
			for (var i = 0; i < radiodata.length; i++) {
				if(radiodata[i].OperatingFrequencyBand == e.BackhaulLinkType)
				{
					OperatingStandards = radiodata[i].OperatingStandards
					break;
				}
			}
			return OperatingStandards

		}
 function attachedDevicesToTopo(d) {
    let _topo = [
        {
            accessType: 0,
            mac: g_lan_data.lan_ipv4.brmac,
            ipv4: g_lan_data.lan_ipv4.IPInterfaceIPAddress,
            sta: [],
            name: gModelName,
            nodeIndex: 1,
            deviceType: 1
        }
    ]
	for (var j = 0; j < d.data.length; j++) {
		 _topo.push({
            accessType: getattachAccessType(d.data[j]),
            rssi: d.data[j].RSSI, 
            mac: d.data[j].MACAddress,
            ipv4: d.data[j].IPAddress,
            linkSpeed: Math.floor(d.data[j].Tx_rate/1000) + '',
            sta: [],
            OnlineTime:d.data[j].ClientUpTime,
            name:(d.data[j].HostName == "" || d.data[j].HostName == "unknown") ? d.data[j].MACAddress : d.data[j].HostName,
            downSpeed:d.data[j].downSpeed,
            nodeIndex: 2,
            deviceType: getFhDeviceType(d.data[j]),
        })
	}
    return {
        topo: _topo
    }
}
