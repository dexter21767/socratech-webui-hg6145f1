<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/lan_ipv6.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title">IPv6设置</p>
			<p class="main_header_hint">在本页面，您可以修改LAN侧IPv6相关配置。</p>
		</div>
		<form id="lan_ipv6_form">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name">DNS来源</div>
					<div class="main_item_content">
						<select id="LanDNS_select">
							<option value="WANConnection">网络连接</option>
							<option value="Static">静态配置</option>
							<option value="HGWProxy">家庭网关代理</option>
						</select>
					</div>
				</div>
				<div class="main_item v6dns">
					<div class="main_item_name">首选DNS</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="LanPri_DNS_text" name="LanPri_DNS_text"/>
					</div>
				</div>
				<div class="main_item v6dns">
					<div class="main_item_name">备选DNS</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="LanSec_DNS_text" name="LanSec_DNS_text"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">启用DHCPv6服务</div>
					<div class="main_item_content">
						<input type="checkbox" id="LanDHCPv6_checkbox"/>&nbsp;
					</div>
				</div>
				<div class="main_item v6address">
					<div class="main_item_name">起始地址</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="LanStartAddress_text" name="LanStartAddress_text"/>
					</div>
				</div>
				<div class="main_item v6address">
					<div class="main_item_name">结束地址</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="LanEndAddress_text" name="LanEndAddress_text"/>
					</div>
					<div id="address-error" class="main_item_error_hint_extra"></div>
				</div>
				<div class="main_item">
					<div class="main_item_name">前缀来源</div>
					<div class="main_item_content">
						<select id="LanPrefix_select">
							<option value="WANDelegated">WANDelegated</option>
							<option value="Static">静态</option>
						</select>
					</div>
				</div>
				<div class="main_item v6prefix">
					<div class="main_item_name">前缀</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="LanPrefix_text" name="LanPrefix_text"/>
					</div>
					<div id="prefix-error" class="main_item_error_hint_extra"></div>
				</div>
				<div class="main_item">
					<div class="main_item_name">地址信息通过DHCP获取</div>
					<div class="main_item_content">
						<input type="checkbox" id="LanAddressInfo_checkbox"/>&nbsp;
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">其他信息通过DHCP获取</div>
					<div class="main_item_content">
						<input type="checkbox" id="LanOtherInfo_checkbox"/>&nbsp;
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">RA报文最大自动发送时间</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="LanMaxRA_text" name="LanMaxRA_text"/>(4-1800)
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">RA报文最小自动发送时间</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="LanMinRA_text" name="LanMinRA_text"/>(4-1800)
					</div>
					<div id="RA-error" class="main_item_error_hint_extra"></div>
				</div>
			</div>
			<div class="main_save">
				<input type="button" id="save_apply" class="input_button" value="保存" onclick="saveApply()"/>
			</div>
		</form>
	</body>
</html>
