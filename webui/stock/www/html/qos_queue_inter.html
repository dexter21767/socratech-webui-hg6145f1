<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/qos_queue_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>

	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint">
				<font i18n="qos_queue_prompt">qos_queue_prompt</font>
			</p>
		</div>
		<form id="qos_form">
			<div class="main_content">
				<div class="main_item" id="bandwidth_div">
					<div class="main_item_name"><font i18n="qos_total_bandwith">qos_total_bandwith</font></div>
					<div class="main_item_content">
						<input type="text" id="Bandwidth" class="input_text" /> Kbps
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="qos_scheduling_strategy">qos_scheduling_strategy</font></div>
					<div class="main_item_content">
						<select id="Plan" class="main_select">
							<option value="priority">PQ</option>
							<option value="weight">WRR</option>
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="8021p_enable_tittle">8021p_enable_tittle</font></div>
					<div class="main_item_content">
						<select id="Enable8021P" class="main_select">
							<option value="0">8021P Mark Disable</option>
							<option value="1">8021P Mark Keep</option>
							<option value="2">8021P Mark Modify</option>
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="dscp_mark_enable">dscp_mark_enable</font></div>
					<div class="main_item_content">
						<input type="checkbox" id="EnableDSCPMark"/>&nbsp;
					</div>
				</div>
			</div>
			<div id="adddiv" style="display:none">
				<div class="main_save">
					<input type="button" id="add_btn" class="input_button" value="Add" onclick="addqueue()"/>
				</div>
			</div>
			<br />
			<table width="95%" style="margin-left: 20px" cellspacing="0" cellpadding="3px" border="1px">
				<tbody id="priority_table" style="display:none">
				<tr>
					<th width="20%"><font i18n="priotity_table_tittle1">priotity_table_tittle1</font></th>
					<th width="40%"><font i18n="priotity_table_tittle2">priotity_table_tittle2</font></th>
					<th width="20%"><font i18n="priotity_table_tittle3">priotity_table_tittle3</font></th>
					<th width="20%" style="display:none"><font i18n="priotity_table_tittle4">priotity_table_tittle4</font></th>
				</tr>
				</tbody>	
				<tbody id="priority_table2">
				</tbody>
				<tbody id="weight_table" style="display:none">
					<tr>
						<th width="20%"><font i18n="weight_table_tittle1">weight_table_tittle1</font></th>
						<th width="40%"><font i18n="weight_table_tittle2">weight_table_tittle2</font></th>
						<th width="20%"><font i18n="weight_table_tittle3">weight_table_tittle3</font></th>
						<th width="20%" style="display:none"><font i18n="weight_table_tittle4">weight_table_tittle4</font></th>
					</tr>
				</tbody>	
				<tbody id="weight_table2">
				</tbody>
			</table>
			<div class="main_save" style="margin-left: 160px">
				<input type="button" id="qos_apply" class="input_button" i18n="qos_apply" i18n-set="value" onclick="saveApply()"/>
			</div>
		</form>
	</body>
</html>
