<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/firewall_enable_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("firewall");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="firewall_level_prompt">firewall_level_prompt</font></p>
		</div>
        <br/>
		<fh-fo-rm id="firewall_form">
			<div class="main_content">
				<div class="main_item"id="firewall_eanble" style="display: none;">
                    <div class="main_item_name"><font i18n="firewall_enable_title">firewall_enable_title</font></div>
                        <div class="main_item_content">
                            <input type="radio" id="firewall_enable"  name="firewall_check" value="1"/><font i18n="firewall_enable">firewall_enable</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
                            <input type="radio" id="firewall_disable" name="firewall_check" value="0"/><font i18n="firewall_disable">firewall_disable</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
                        </div>
                    </div>
					<div class="main_item" id="firewall_spi_status_div" style="display: none;" >
						<div class="main_item_name"><font i18n="firewall_spi_status">firewall_spi_status</font></div>
						<div class="main_item_content">
						Stateful
						</div>
					</div>
                    <div class="main_item" id="firewall_level_div">
					<div class="main_item_name"><font i18n="firewall_level_title">firewall_level_title</font></div>
					<div class="main_item_content">
                        <div id="custom_level" style="display: none;">
                        <input type="radio" id="firewall_custom" name="firewall_enable" value="4"/><font i18n="firewall_custom">firewall_custom</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 
						 </div>
                        <input type="radio" id="firewall_high"  name="firewall_enable" value="3"/><font i18n="firewall_high">firewall_high</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
						<input type="radio" id="firewall_medium"  name="firewall_enable" value="2"/><font i18n="firewall_medium">firewall_medium</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; 
						<input type="radio" id="firewall_low"  name="firewall_enable" value="1"/><font i18n="firewall_low">firewall_low</font>
						<!-- <input type="radio" name="firewall_enable" value="0"/><font i18n="firewall_off">firewall_off</font> -->
						&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
				<div class="main_button" id="save_button">	
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="firewall_apply" class="input_button" i18n="firewall_apply" i18n-set="value" onclick="save_apply()"/>&nbsp; &nbsp;
						<input type="button" id="firewall_cancel" class="input_button" i18n="firewall_cancel" i18n-set="value" onclick="window.location.reload()"/>
					</div>
				</div>
			</div>
		</fh-fo-rm>
	</body>
</html>
