<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/qos_app_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script> 
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="main_header_hint_prompt">On this pages, you could modify the character of QoS services. Tips, you can configure up to 4 items.</font></p>
		</div>
		<form id="qos_form">
			<br />
			<table width="95%" style="margin-left: 20px" cellspacing="0" cellpadding="3px" border="1px">
				<tr>
					<th width="35%"><font i18n="qos_form_tittle1">Service Name</font></th>
					<th width="35%"><font i18n="qos_form_tittle2">Enter Queue</font></th>
					<th width="30%"><font i18n="qos_form_tittle3">Operation</font></th>
				</tr>
				<tbody id="apps">
				</tbody>
			</table>
			<br/>
			
			<div id="adddiv" style="display:none">
				<div class="main_content">
					<div class="main_item">
						<div class="main_item_name"><font i18n="qos_form_tittle1">Service Name</font></div>
						<div class="main_item_content">
							<select id="AppName" class="main_select">
								<option value="TR069">TR069</option> 
								<option value="VOIP">VOIP</option>
								<option value="iTV">iTV</option>
								<option value="INTERNET">INTERNET</option>
							</select>
						</div>
					</div>
					<div class="main_item">
						<div class="main_item_name"><font i18n="qos_form_tittle2">Enter Queue</font></div>
						<div class="main_item_content">
							<select id="ClassQueue" class="main_select">
								<!--<option value="1">Q1</option>
								<option value="2">Q2</option>
								<option value="3">Q3</option>
								<option value="4">Q4</option>
								<option value="5">Q5</option>
								<option value="6">Q6</option>
								<option value="7">Q7</option>
								<option value="8">Q8</option>-->
							</select>
						</div>
					</div>
				</div>
				<div class="main_save" style="margin-left: 160px">
					<input type="button" id="qos_apply_btn" class="input_button"  i18n="qos_add" i18n-set="value" onclick="addApp()"/>
				</div>
			</div>
		</form>
	</body>
</html>
