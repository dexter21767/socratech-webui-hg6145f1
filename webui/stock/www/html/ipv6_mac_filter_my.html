<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/ipv6_mac_filter_my.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
		
	</head>
	<script type="text/javascript">
		setDomain("firewall");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="v6_macaddr_filterPrompt">v6_macaddr_filterPrompt</font></p>
		</div>
	    </br>
		<form id="ipv6_mac_filter_list_form">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name"><font i18n="v6_macaddrenable_title">v6_macaddrenable_title</font></div>
					<div class="main_item_content">
						<input type="radio" id="ipv6_mac_filter_enable" name="ipv6_mac_filter_enable" value="1"/><font i18n="firewall_enable">firewall_enable</font>&nbsp;&nbsp;
						<input type="radio" id="ipv6_mac_filter_disable" name="ipv6_mac_filter_enable" value="0"/><font i18n="firewall_disable">firewall_disable</font>
						&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
				<div class="main_item" style="height:50px">
					<div class="main_item_name" style="height:48px"><font i18n="v6_macaddrdown_title">v6_macaddrdown_title</font></div>
					<div class="main_item_content" style="height:48px">
						<div style="margin-top: 11px">
							<input type="radio" id="ipv6_mac_filter_mode_white" name="ipv6_mac_filter_mode" onclick ="tip()" value="white"/><font i18n="firewall_white">firewall_white</font>&nbsp;&nbsp;
							<input type="radio" id="ipv6_mac_filter_mode_black" name="ipv6_mac_filter_mode" value="black"/><font i18n="firewall_black">firewall_black</font>
							&nbsp;&nbsp;<span class="redcolorfont">*</span>
						</div>
					</div>
				</div>
				<div class="main_item">
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="filter_mode_apply" class="input_button" i18n="firewall_apply" i18n-set="value" onclick="EnableApply()"/>
						<input type="button" id="filter_mode_cancel" class="input_button" i18n="firewall_cancel" i18n-set="value" onclick="EnableCancel()"/>
					</div>
					<div style="float:right">
						<input type="button" i18n="firewall_add" i18n-set="value" id="fw_add" class="input_button" onClick="addfilter()">
						<input type="button" i18n="firewall_delete" i18n-set="value" id="fw_delete" class="input_button" onClick="click_remove()">
			  			<input type="button" i18n="firewall_delete_all" i18n-set="value" id="fw_deleteAll" class="input_button" onClick="click_remove_all()">
					<br/>
				</div>
			</div>
			
			</div>
			<br/>
			<table width="100%" class="table_bg" cellspacing="1" cellpadding="0" border="0">
				<tr class="table_title">
					<td colspan="5"><font i18n="v6_macaddr_filterListHead">v6_macaddr_filterListHead</font></td>
				</tr>
				<tr class="table_head_title">
					<td width="15%" align='center'><font i18n="fw_filterID">fw_filterID</font></td>
					<td width="50%" align='center'><font i18n="macaddr">macaddr</font></td>
					<td width="15%" align='center' id="td_urltime"><font i18n="template">emplate</font></td>
					<td width="8%" align='center'><font i18n="firewall_enable">firewall_enable</font></td>
					<td width="2%" align='center'></font></td>	
				</tr>
				<tbody id='ipv6_mac_filter_List' style="font-size: 12px">
				</tbody> 
			</table>
			</br>
			<div class="main_content"  id = "fw_config_form" style="display:none">
				<div class="main_item">
					<div class="main_item_name"><font i18n="macaddr">macaddr</font></div>
					<div class="main_item_content">
						<input type="text"  class="input_text" autocomplete="off" id="ipv6_mac_address" name="ipv6_mac_address" style="width:150px"/>
						<select name="mac_host_adress" id="mac_host_adress" style="width:145px">
						</select><font i18n="macaddr_macTips">macaddr_macTips</font>
					</div>
					<div id="MinSourceAddress-error" class="main_item_error_hint_extra"></div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="template_title">template_title</font></div>
					<div class="main_item_content">
						<select id="template"  style="width:150px">
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="firewall_enable">firewall_enable</font></div>
					<div class="main_item_content">
						<select id="ipv6_mac_enable"  style="width:150px">
						  <option value="1" i18n="firewall_enable">Enable</option>
						  <option value="0" i18n="firewall_disable">Disable</option>
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="firewall_apply" class="input_button" i18n="firewall_apply" i18n-set="value" onclick="doSave()"/>
						<input type="button" id="firewall_cancel" class="input_button" i18n="firewall_cancel" i18n-set="value" onclick="displayTableHtml()"/>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
