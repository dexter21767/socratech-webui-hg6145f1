<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/aes.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/samba_server.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("samba");
	</script>
	<style type="text/css">
		.main_item_error_hint {color: red; clear: both;}
		.input_text {width: 160px;}
		
		#progress
		{
			height: 24px;
			width: 200px;
			border: none;
		}
		.inner-progress 
		{
			background: #2C5EA4;
		}
	</style>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="samba_prompt">samba_prompt</font></p>
		</div>
		<br/>
		<form id="wlanAdv_settings_form" method="post">
			<div class="main_content ">
				<div class="table_title table_bg"><font i18n="samba_head">samba_head</font></div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="samba_head">samba_head</font></div>
					<div class="main_item_content">
						<input type="radio" id="samba_enable" name="samba_enable" value="1" checked="checked"><font i18n="samba_enableTitle">samba_enableTitle</font>&nbsp;&nbsp;&nbsp;
						<input type="radio" id="samba_disable" name="samba_enable" value="0"><font i18n="samba_disableTitle">samba_disableTitle</font>
						<span class="redcolorfont">*</span>
					</div>
				</div>
				<div id="user_pwd" style="display: none">
					<div class="main_item">
						<div class="main_item_name"><font i18n="samba_userTitle">samba_userTitle</font></div>
						<div class="main_item_content">
							<input type="text" class="input_text input_short" autocomplete="off" id="samba_user" name="samba_user"/>
							<span class="redcolorfont">*</span>
							<font i18n="samba_userTips">samba_userTips</font>
						</div>
						<div id="samba-error" class="main_item_error_hint_extra"></div>
					</div>
					<div class="main_item">
						<div class="main_item_name"><font i18n="samba_pwdTitle">samba_pwdTitle</font></div>
						<div class="main_item_content">
							<input type="text" class="input_text input_short fh-text-security" autocomplete="off" id="samba_pwd" name="samba_pwd" oncopy="return false"/>
                            <span class="redcolorfont">*</span>
							<font i18n="samba_pwdTips">samba_pwdTips</font>
						</div>
						<div id="samba-error" class="main_item_error_hint_extra"></div>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"></div>
					<div class="main_item_content">
						<input type="button" id="samba_apply" onclick="saveApply()" i18n="samba_apply" i18n-set="value" class="input_button">
						<input type="button" id="samba_cancel" onclick="CancelBtn()" i18n="samba_cancel" i18n-set="value" class="input_button">
					</div>
				</div>
			</div>
		</form>
	</body>
	<script type="text/javascript">
		setInterval(function(){
		    if($("#samba_pwd").length > 0){
				if(!$("#samba_pwd").hasClass("fh-text-security")){
					$("#samba_pwd").addClass("fh-text-security");
				}
			}else{
				window.location.reload();
			}
			
		}, 10);
	</script>
</html>
