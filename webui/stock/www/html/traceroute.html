<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/traceroute.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_title">Traceroute测试</p>
			<p class="main_header_hint">在本页面，您可以进行Traceroute测试。</p>
		</div>
		<form id="traceroute_form">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name">网络连接</div>
					<div class="main_item_content">
						<select id="wan_connect" class="main_select">
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">IP版本</div>
					<div class="main_item_content">
						<select id="ip_version" class="main_select">
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name">目的地址</div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off" id="address" name="address"/>
					</div>
				</div>
			</div>
			<div class="main_save">
				<input type="button" class="input_button" id="save_apply" value="Traceroute测试" onclick="saveApply()"/>
			</div>
			<br />
			<div id="result">
			</div>
		</form>
	</body>
</html>
