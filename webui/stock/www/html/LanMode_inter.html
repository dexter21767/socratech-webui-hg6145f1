<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
			document.write('<link rel="stylesheet" type="text/css" href="../css/main_style.css?'+new Date().getTime()+'"><'+'/'+'link>');
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
	        document.write('<script  src="../js/LanMode_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("internet");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font id="lan_port_mode_Prompt" i18n="lan_port_mode_Prompt">lan_port_mode_Prompt</font></p>
		</div>
		<form id="qos_base_form" method="post">
			<div class="main_content">
				<div class="main_item" id="lan_port_mode_enable_div" style = "display: none;">
					<div class="main_item_name"><font i18n="lan_port_mode_enable_title">LAN Port Work Enable</font></div>
						<div class="main_item_content">
							<input type="radio" id="lan_port_mode_enable" name="lan_port_mode_enable" value="1"/><font i18n="ipv6_enable_tip">ipv6_enable_tip</font>&nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;
							<input type="radio" id="lan_port_mode_disable" name="lan_port_mode_enable" value="0"/><font i18n="ipv6_disable_tip">ipv6_disable_tip</font>
							&nbsp;&nbsp;&nbsp;<span class="redcolorfont">*</span>
						</div>
					</div>
				</div>
				<div class="main_item lan_port_mode_block">
					<div class="main_item_name"><font i18n="lan_port_mode_title" id="lan_port_mode">LAN Port Work Mode</font></div>
					<div class="main_item_content">
						LAN1<input type="checkbox" id="lan1_checkbox"/>&nbsp;&nbsp;&nbsp;
						LAN2<input type="checkbox" id="lan2_checkbox"/>&nbsp;&nbsp;&nbsp;
						LAN3<input type="checkbox" id="lan3_checkbox"/>&nbsp;&nbsp;&nbsp;
						LAN4<input type="checkbox" id="lan4_checkbox"/>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"></div>
					<div class="main_item_content">
						<input type="button" id="save_apply" class="input_button" i18n="inet_apply" i18n-set="value" onclick="saveApply()"/>
						<input type="button" id="save_cancel" class="input_button" i18n="inet_cancel" i18n-set="value" onclick="cancelApply()"/>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
