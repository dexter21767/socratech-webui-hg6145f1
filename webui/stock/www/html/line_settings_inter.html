<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/line_settings_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("internet");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="line_settings_prompt">line_settings_prompt</font></p>
            
		</div>
        <br/>
		<fh-fo-rm id="line_settings_form">
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name"><font i18n="line_id_enable_title">line_id_enable_title</font></div>
					<div class="main_item_content">
                       	<input type="checkbox" id="line_enable"/>&nbsp;
					</div>
                    <div class="main_item_name"><font i18n="line_id">line_id</font></div>
                    <div class="main_item_content">
                       <input type="text" class="input_text" maxlength="32" style="width: 133px;" autocomplete="off" id="line_id" name="line_id"/>
                       <font i18n="lineTips">lineTips</font>
                    </div>
				</div>
				<div class="main_button" id="save_button">	
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" class="input_button" i18n="internet_apply" i18n-set="value" onclick="save_apply()"/>&nbsp; &nbsp;
						<input type="button" class="input_button" i18n="internet_cancel" i18n-set="value" onclick="window.location.reload()"/>
					</div>
				</div>
			</div>
		</fh-fo-rm>
	</body>
</html>
