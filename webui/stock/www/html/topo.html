    setTopo:function(call){
        var that = this
        this.loading = true;
        $.ajax({
            url:"../cgi-bin/ajax?ajaxmethod=get_topology_info&_="+Math.random(),
			//url:"../fake/1111.json",
			type: "GET",
			dataType: "json",
            success: function(data) {
                if(data)
                {
					var top = data.topology_info;
					top = JSON.parse(JSON.stringify(top).replace(/_point_/g, "."));
					//console.log(top);
                    var topoData = dataToTopo(top);
					console.log(topoData);
                    call(topoData)
                   // adjustHeightCommon()
                    that.loading = false
                }
                else
                {
                    console.error(data.errMsg)
                }
            },
            error: function(data) {
                
            }
        });
    },
    upData:function(){
        var that = this
        setInterval(function(){
            if(!that.loading)
            {
                that.setTopo(function(topoData){
                    that.topoTree.updata(topoData.data,{
							width:900 + 50*topoData.maxWidth,
                            height:200 * topoData.deep,
                        })
                })
            }
            
        },that.intervalTime)
    }
}
