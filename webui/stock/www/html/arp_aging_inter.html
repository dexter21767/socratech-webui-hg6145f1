<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/arp_aging_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("arp");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="arp_aging_prompt">arp_aging_prompt</font></p>
		</div>
	    </br>
		<form id="ip_filter_list_form" method="post">
		
			<div class="main_content">
				<div class="main_item">
					<div class="main_item_name"><font i18n="arp_aging_Enable_title">arp_aging_Enable_title</font></div>
					<div class="main_item_content">
						<input type="radio" id="arp_aging_enable" name="arp_aging_enable" value="1" /><font i18n="arp_aging_Enable">arp_aging_Enable</font>&nbsp;&nbsp;
						<input type="radio" id="arp_aging_disable" name="arp_aging_enable" value="0" /><font i18n="arp_aging_Disable">arp_aging_Disable</font>
						&nbsp;&nbsp;<span class="redcolorfont">*</span>
					</div>
				</div>
				<div class="main_item">
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="arp_aging_enable_apply" class="input_button" i18n="firewall_apply" i18n-set="value" onclick="EnableApply()"/>
						<input type="button" id="arp_aging_enable_cancel" class="input_button" i18n="firewall_cancel" i18n-set="value" onclick="window.location.reload()"/>
					</div>
			</div>
			<div class="main_content">		
				
					<div style="float:right">
						<input type="button" value="Add" id="fw_add" class="input_button" onClick="addfilter()">
						<input type="button" value="Delete" id="fw_delete" class="input_button" onClick="click_remove()">
			  			<input type="button" value="Delete All" id="fw_deleteAll" class="input_button" onClick="click_remove_all()">
					<br/>
				</div>
			</div>
			<br/>
			<table width="100%" class="table_bg" cellspacing="1" cellpadding="0" border="0">
				<tr class="table_title">
					<td colspan="6"><font i18n="arp_aging_list_title">arp_aging_list_title</font></td>
				</tr>
				<tr class="table_head_title">
					<td width="10%" align='center'><font i18n="fw_filterID">fw_filterID</font></td>
					<td width="40%" align='center'><font i18n="wan_name">wan_name</font></td>
					<td width="40%" align='center'><font i18n="arp_aging_time_s">arp_aging_time_s</font></td>
					<td width="10%" align='center' id="fw_remove_flag_title"></td>		
				</tr>
				<tbody id='ipfilter_List' style="font-size: 12px">
				</tbody> 
			</table>
			</br>
			<div class="main_content" id = "fw_config_form" style="display:none">
				<div class="main_item">
					<div class="main_item_name"><font i18n="wan_name">wan_name</font></div>
					<div class="main_item_content">
						<select id="wan_name"  style="width:200px">
						</select>
					</div>
					<div id="MinSourceAddress-error" class="main_item_error_hint_extra"></div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="arp_aging_time">arp_aging_time</font></div>
					<div class="main_item_content">
						<input type="text" class="input_text" autocomplete="off"style="width: 200px;" id="arp_aging_time"  name="arp_aging_time" style="width:150px"/>
						<span class="redcolorfont">*</span><font class="linebr" i18n="arp_aging_timeTips">arp_aging_timeTips</font>
					</div>
					<div id="MinSourcePort-error" class="main_item_error_hint_extra"></div>
				</div>
				<div class="main_item">
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="arp_aging_apply" class="input_button" i18n="firewall_apply" i18n-set="value" onclick="doSave()"/>
						<input type="button" id="arp_aging_cancel" class="input_button" i18n="firewall_cancel" i18n-set="value" onclick="window.location.reload()"/>
					</div>
				</div>
			</div>
		</form>
	</body>
</html>
