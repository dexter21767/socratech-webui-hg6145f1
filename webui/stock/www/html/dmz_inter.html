<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
	<head>
		<meta http-equiv='Content-Type' content='text/html; charset=utf-8'/>
		<meta HTTP-EQUIV='Pragma' CONTENT='no-cache'>
		<script language ="javascript "type ="text/javascript">
	        document.write('<script  src="../js/util.js?'+new Date().getTime()+'"><'+'/'+'script>');
			document.write('<script  src="../js/dmz_inter.js?'+new Date().getTime()+'"><'+'/'+'script>');
		</script>
	</head>
	<script type="text/javascript">
		setDomain("application");
	</script>
	<body class='main_config_body'>
		<div class="main_header">
			<p class="main_header_hint"><font i18n="dmz_prompt">dmz_prompt</font></p>
		</div>
		</br>
		<fh-fo-rm id="dmz_list_form">
			<div class="main_content" id="id_add_div">
				<div style="float:right">
					<input type="button" i18n="app_add" i18n-set="value" id="app_add" class="input_button" onClick="addfilter()">
					<input type="button" i18n="app_delete" i18n-set="value" id="app_delete" class="input_button" onClick="click_remove()">
			  		<input type="button" i18n="app_delete_all" i18n-set="value" id="app_deleteAll" class="input_button" onClick="click_remove_all()">
					<br/>
				</div>
			</div>
			</div>
			<br/>
			<table width="100%" class="table_bg" cellspacing="1" cellpadding="0" border="0">
				<tr class="table_title">
					<td colspan="5"><font i18n="dmz_list_title">dmz_list_title</font></td>
				</tr>
				<tr class="table_head_title">
					<td width="15%" align='center'><font i18n="app_id">app_id</font></td>
					<td width="30%" align='center'><font i18n="app_dmz_ip_address">app_dmz_ip_address</font></td>
					<td width="40%" align='center'><font i18n="app_dmz_wan">app_dmz_wan</font></td>
					<td width="10%" align='center'><font i18n="app_enable">app_enable</font></td>
					<td width="5%" align='center'></td>
				</tr>
				<tbody id='dmz_list' style="font-size: 12px">
				</tbody> 
			</table>
			</br>
			<div class="main_content"  id = "fw_config_form" style = "display:none">
				<div class="main_item">
					<div class="main_item_name"><font i18n="app_dmz_ip_address">app_dmz_ip_address</font></div>
					<div class="main_item_content">
						<input type="text"  class="input_text" autocomplete="off" id="dmz_host_ip_address" name="dmz_host_ip_address" style="width:150px"/>
                        <select id="host_name" style="width: 40%"></select>
					</div>
					<div id="MinSourceAddress-error" class="main_item_error_hint_extra"></div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="app_dmz_wan">app_dmz_wan</font></div>
					<div class="main_item_content">
						<select id="dmz_wan" style="width: 40%"></select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_item_name"><font i18n="app_enable">app_enable</font></div>
					<div class="main_item_content">
						<select id="dmz_enable" style="width:150px">
						  <option value="1" i18n="app_enable">Enable</option>
						  <option value="0" i18n="app_disable">Disable</option>
						</select>
					</div>
				</div>
				<div class="main_item">
					<div class="main_submit" style="width: 25%;"></div>				
					<div class="main_submit" style="width: 75%;">
						<input type="button" id="dmz_apply" class="input_button" i18n="app_apply" i18n-set="value" onclick="doSave()"/>
						<input type="button" id="dmz_cancel" class="input_button" i18n="app_cancel" i18n-set="value" onclick="window.location.reload()"/>
					</div>
				</div>
			</div>
		</fh-fo-rm>
	</body>
</html>
